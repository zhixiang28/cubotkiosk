<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #1b1642;
  --bg-glow: #2e2675;
  --eye: #f1eeff;
  --text: #f1eeff;
  --muted: #aaa4dc;
  --line: rgba(241, 238, 255, 0.18);
  --listen: #7dd3fc;
  --think: #c4b5fd;
  --speak: #fde68a;
  --card: #2a2463;
  --card-2: #342d78;
  --card-text: #f1eeff;
  --pin: #f97362;
  --here: #0ea5e9;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #ece9ff;
    --bg-glow: #ddd7ff;
    --eye: #1b1642;
    --text: #1b1642;
    --muted: #5b5492;
    --line: rgba(27, 22, 66, 0.15);
    --listen: #0284c7;
    --think: #7c3aed;
    --speak: #b45309;
    --card: #ffffff;
    --card-2: #f3f1ff;
    --card-text: #1b1642;
    --pin: #e0452f;
    --here: #0284c7;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 38%, var(--bg-glow), var(--bg) 72%);
  background-color: var(--bg);
  color: var(--text);
  font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body.no-cursor, body.no-cursor * { cursor: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--listen); outline-offset: 3px; }

/* ---------------- Top bar ---------------- */
.top {
  position: fixed;
  inset: 0 0 auto 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 2.4vh 2.6vw;
  z-index: 5;
  pointer-events: none;
}
.brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: clamp(20px, 2vw, 28px); }
.brand img { height: clamp(32px, 5vh, 54px); width: auto; }
.clock { text-align: right; line-height: 1.15; }
.char-switch { pointer-events: auto; display: flex; gap: 4px; padding: 4px; margin-right: 18px; border-radius: 999px;
  background: var(--card-2); border: 2px solid var(--line); }
.char-switch button { border: 0; background: transparent; color: var(--card-text); border-radius: 999px; padding: 6px 14px;
  font-weight: 700; font-size: clamp(13px, 1.2vw, 16px); opacity: 0.7; white-space: nowrap; }
.char-switch button[aria-pressed="true"] { background: var(--speak); color: var(--bg); opacity: 1; }
@media (max-width: 900px) { .char-switch button .cs-word { display: none; } }
.timers { flex: 1; min-width: 0; display: flex; flex-wrap: nowrap; justify-content: center; gap: 8px; padding: 0 16px; overflow: hidden; }
.timers.many .tm-label { display: none; }
.tm { display: inline-flex; align-items: center; gap: 10px; background: var(--card-2); color: var(--card-text); border: 2px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; font-size: clamp(14px, 1.4vw, 18px); font-weight: 700; }
.tm.soon { border-color: var(--speak); }
.tm-icon svg { width: 20px; height: 20px; display: block; color: var(--listen); }
.tm-left { font-variant-numeric: tabular-nums; font-size: 1.15em; min-width: 3.2em; text-align: right; }
.tm-x { border: 0; background: var(--bg); color: var(--muted); width: 32px; height: 32px; border-radius: 50%; font-size: 20px; line-height: 1; cursor: pointer; }
.big-count { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 8; font-size: 42vh; font-weight: 900; color: var(--speak); background: color-mix(in srgb, var(--bg) 80%, transparent); font-variant-numeric: tabular-nums; }
.big-count[hidden] { display: none; }
.big-count { grid-template-rows: 1fr auto; padding-bottom: 8vh; }
.big-count #bigNum { align-self: center; line-height: 1; }
#bigStop { pointer-events: auto; font-size: clamp(18px, 2vw, 26px); padding: 14px 30px; }
.clock .time { font-size: clamp(20px, 2.2vw, 30px); font-weight: 800; }
.clock .date { font-size: clamp(13px, 1.2vw, 16px); color: var(--muted); }

/* ---------------- Stage (face + conversation) ---------------- */
.stage {
  position: fixed;
  inset: 0 auto 0 0;
  width: 100vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3.2vh;
  padding: 11vh 3vw 4vh;
  transition: width 0.5s cubic-bezier(.3, .8, .3, 1);
  cursor: pointer;
}
body.has-panel .stage { width: 47vw; }

.face { display: flex; flex-direction: column; align-items: center; gap: 4vh; }
.eyes {
  display: flex;
  gap: min(10vw, 15vh);
  transform: translate(var(--lx, 0px), var(--ly, 0px));
  transition: transform 0.35s ease;
}
.eye {
  width: min(10vw, 15vh);
  height: min(17vw, 26vh);
  background: var(--eye);
  border-radius: 999px;
  transition: width 0.4s ease, height 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease;
}
body.has-panel .eye { width: min(6vw, 11vh); height: min(10vw, 18vh); }
body.has-panel .eyes { gap: min(6vw, 11vh); }
.eye.blink { animation: blink 0.18s ease; }
@keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.06); } }
.mouth {
  width: min(6vw, 9vh);
  height: 10px;
  border-radius: 999px;
  background: var(--eye);
  opacity: 0.85;
  transition: background 0.3s ease, width 0.3s ease;
}
body.listening .eye { box-shadow: 0 0 60px var(--listen); background: var(--listen); }
body.listening .mouth { width: min(3vw, 5vh); background: var(--listen); }
body.thinking .eyes { transform: translate(0, -3vh); }
body.thinking .eye { height: min(9vw, 14vh); background: var(--think); }
body.thinking .mouth { background: var(--think); }
body.speaking .eye { border-radius: 999px 999px 45% 45%; height: min(13vw, 20vh); }
body.has-panel.speaking .eye { height: min(8vw, 14vh); }
body.speaking .mouth { background: var(--speak); animation: talk 0.28s ease-in-out infinite alternate; }
@keyframes talk { from { height: 8px; } to { height: 30px; } }

.talk { width: min(860px, 100%); text-align: center; }
.you { color: var(--muted); font-size: clamp(15px, 1.7vw, 20px); min-height: 1.4em; margin-bottom: 1vh; }
.bubble {
  display: inline-block;
  max-width: 100%;
  max-height: 24vh;
  overflow-y: auto;
  background: var(--card);
  color: var(--card-text);
  border-radius: 26px;
  padding: 18px 28px;
  font-size: clamp(19px, 2.3vw, 30px);
  font-weight: 700;
  line-height: 1.35;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
}
.bubble:empty { display: none; }
.bubble { overscroll-behavior: contain; scrollbar-width: thin; }
body.has-panel .bubble { font-size: clamp(16px, 1.6vw, 22px); max-height: 30vh; padding: 16px 22px; }
body.has-panel .stage { gap: 2.2vh; }
body.has-panel .hint { display: none; }
body.has-panel .chips .chip { font-size: clamp(14px, 1.3vw, 17px); padding: 9px 16px; }
body.has-panel .face { gap: 2.5vh; }

.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 900px; }
.chip {
  border: 2px solid var(--line);
  background: var(--card-2);
  color: var(--card-text);
  border-radius: 999px;
  padding: 12px 22px;
  font-size: clamp(15px, 1.6vw, 20px);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  transition: transform 0.15s ease, border-color 0.2s ease;
}
.chip:active { transform: scale(0.96); }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip.primary { border-color: var(--listen); }

.type-row { display: flex; gap: 10px; width: min(760px, 100%); }
.type-row input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: clamp(16px, 1.8vw, 21px);
  padding: 14px 22px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--card-text);
  cursor: text;
}
.type-row input:focus { border-color: var(--listen); outline: none; }
.send {
  border: none;
  border-radius: 999px;
  padding: 0 26px;
  background: var(--listen);
  color: var(--bg);
  font-weight: 800;
  font-size: clamp(16px, 1.8vw, 21px);
}
.hint { color: var(--muted); font-size: clamp(13px, 1.3vw, 16px); }

/* ---------------- Side panel (map, people) ---------------- */
.panel {
  position: fixed;
  top: 10vh;
  max-height: 87vh;
  right: 2vw;
  width: 49vw;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--card);
  color: var(--card-text);
  border-radius: 28px;
  padding: 24px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  transform: translateX(115%);
  transition: transform 0.5s cubic-bezier(.3, .8, .3, 1);
  overflow-y: auto;
  z-index: 4;
}
body.has-panel .panel { transform: translateX(0); }
.panel-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
.panel-head h2 { font-size: clamp(22px, 2.2vw, 30px); font-weight: 800; line-height: 1.15; }
.panel-head p { font-size: clamp(15px, 1.5vw, 19px); line-height: 1.45; margin-top: 6px; color: var(--card-text); opacity: 0.85; }
.close {
  flex: none;
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 8px 18px;
  font-weight: 800;
}
.person {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card-2);
  border-radius: 20px;
  padding: 14px 18px;
}
.avatar {
  flex: none;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--pin);
  color: #fff;
  font-weight: 800;
  font-size: 20px;
}
.person .name { font-weight: 800; font-size: 20px; }
.person .role { color: var(--card-text); opacity: 0.75; font-size: 16px; }

.map-wrap { position: relative; border-radius: 16px; overflow: hidden; line-height: 0; flex: none; width: 100%; align-self: center; }
.map-wrap img { width: 100%; height: auto; display: block; }
.map-missing {
  aspect-ratio: 10 / 7;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  line-height: 1.4;
  font-size: 16px;
  background: var(--bg);
  color: var(--muted);
}
.pin { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
.pin .dot { width: 14px; height: 14px; border-radius: 50%; background: #8f89c9; border: 2px solid #fff; }
.pin .label {
  position: absolute;
  left: 50%;
  top: -10px;
  transform: translate(-50%, -100%);
  white-space: nowrap;
  font-size: 14px;
  font-weight: 800;
  line-height: 1;
  padding: 6px 10px;
  border-radius: 999px;
  background: #1b1642;
  color: #fff;
}
.pin.target .dot { width: 24px; height: 24px; background: var(--pin); animation: pulse 1.2s ease-out infinite; }
.pin.target .label { background: var(--pin); font-size: 16px; }
.pin.here .dot { width: 20px; height: 20px; background: var(--here); }
.pin.here .label { background: var(--here); left: 26px; top: 50%; transform: translate(0, -50%); }
.pin.here.flip .label { left: auto; right: 26px; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(249, 115, 98, 0.75); }
  100% { box-shadow: 0 0 0 24px rgba(249, 115, 98, 0); }
}

.floor-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.floor-tabs button {
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 7px 14px;
  font-weight: 800;
  font-size: 15px;
}
.floor-tabs button.on { background: var(--listen); color: var(--bg); border-color: var(--listen); }
.floor-tabs button.has-target:not(.on) { border-color: var(--pin); }
.floor-note { font-size: 15px; font-weight: 700; color: var(--pin); }
.route-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.route-svg .halo { fill: none; stroke: #ffffff; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
.route-svg .dash { fill: none; stroke: var(--pin); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 20; animation: march 0.9s linear infinite; }
@keyframes march { to { stroke-dashoffset: -21; } }
.pin.step .dot { width: 18px; height: 18px; background: #3f3a85; }
.pin.step .label { background: #3f3a85; font-size: 13px; }
.floor-note.clickable { cursor: pointer; text-decoration: underline; }
#voiceBox { display: flex; flex-direction: column; gap: 12px; }
#voiceBox[hidden] { display: none; }
.vc-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.vc-sliders label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 15px; }
.vc-sliders input { width: 100%; accent-color: var(--listen); }
#vcList { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; }
.vc-row { display: flex; align-items: center; gap: 10px; background: var(--card-2); border: 2px solid transparent; border-radius: 16px; padding: 10px 14px; }
.vc-row.on { border-color: var(--listen); }
.vc-row .vc-name { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; line-height: 1.25; }
.vc-row .vc-sub { display: block; font-weight: 600; font-size: 13px; opacity: 0.7; }
.vc-row .chip { padding: 8px 14px; font-size: 15px; }
.diag { position: fixed; top: 10vh; left: 2vw; z-index: 9; max-width: 44vw; background: rgba(10, 8, 30, 0.88); color: #e8e6ff; border-radius: 12px; padding: 12px 14px; font: 13px/1.5 Consolas, monospace; white-space: pre-wrap; pointer-events: none; }
.diag b { color: #7dd3fc; }
#lightsBox { display: flex; flex-direction: column; gap: 12px; }
#lightsBox[hidden], #ltRows[hidden], #ltPin[hidden] { display: none; }
#ltRows { display: flex; flex-direction: column; gap: 12px; }
.lt-row { display: flex; align-items: center; gap: 14px; background: var(--card-2); border-radius: 18px; padding: 14px 18px; }
.lt-bulb { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }
.lt-bulb svg { width: 26px; height: 26px; }
.lt-row.on .lt-bulb { background: var(--speak); color: #1b1642; box-shadow: 0 0 26px var(--speak); }
.lt-name { flex: 1; font-weight: 800; font-size: clamp(16px, 1.5vw, 20px); }
.lt-state { font-weight: 700; font-size: 15px; opacity: 0.75; min-width: 2.2em; text-align: right; }
#ltPin { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#ltDots { font-size: 26px; letter-spacing: 10px; min-height: 1.2em; }
#ltKeys { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
#ltKeys button { height: 60px; border-radius: 16px; border: 2px solid var(--line); background: var(--card-2); font-size: 22px; font-weight: 800; }
#ltKeys button:disabled { visibility: hidden; }
#parcelBox { display: flex; flex-direction: column; gap: 14px; }
#parcelBox[hidden] { display: none; }
.pc-text { font-size: clamp(16px, 1.5vw, 20px); font-weight: 700; }
/* internet answer card */
#webBox { display: flex; flex-direction: column; gap: 14px; }
#webBox[hidden] { display: none; }
.wb-img { width: 100%; max-height: 32vh; object-fit: contain; border-radius: 18px; background: var(--bg); }
.wb-img[hidden] { display: none; }
.wb-answer { font-size: clamp(18px, 1.8vw, 24px); font-weight: 700; line-height: 1.4; }
.wb-answer.wait { opacity: 0.6; }
.wb-src { border-top: 2px solid var(--line); padding-top: 10px; }
.wb-src b { display: block; font-size: clamp(15px, 1.4vw, 18px); }
.wb-src p { font-size: clamp(14px, 1.25vw, 17px); line-height: 1.45; opacity: 0.85; margin-top: 4px; }
.wb-src span { display: block; font-size: 12px; opacity: 0.6; margin-top: 4px; }
.pc-media { position: relative; border-radius: 16px; overflow: hidden; background: #000; max-height: 46vh; }
.pc-media video, .pc-media img { display: block; width: 100%; max-height: 46vh; object-fit: contain; }
.pc-frame { position: absolute; inset: 12% 10%; border: 3px dashed rgba(255,255,255,0.8); border-radius: 14px; pointer-events: none; }
.pc-status { position: absolute; left: 12px; bottom: 12px; padding: 6px 14px; border-radius: 999px; background: rgba(27,22,66,0.85); color: #fff; font-weight: 800; font-size: 15px; }
.pc-status:empty { display: none; }
#pcList { max-height: 34vh; overflow-y: auto; }
.pc-done { display: flex; align-items: center; gap: 16px; background: var(--card-2); border-radius: 18px; padding: 18px; }
.pc-done p { font-size: clamp(16px, 1.5vw, 20px); font-weight: 700; line-height: 1.4; }
.pc-tick { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--listen); color: var(--bg); font-size: 28px; font-weight: 800; }
.pc-btns { justify-content: flex-start; }
.view-toggle { display: flex; gap: 8px; }
.view-toggle button {
  border: 2px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 8px 18px;
  font-weight: 800;
  font-size: 16px;
}
.view-toggle button.on { background: var(--pin); color: #fff; border-color: var(--pin); }
#view3d {
  position: relative;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 30%, var(--card-2), var(--card));
  cursor: grab;
  touch-action: none;
}
#view3d canvas { display: block; }
.v3-hud {
  position: absolute;
  left: 12px;
  top: 12px;
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(27, 22, 66, 0.78);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  pointer-events: none;
}
.v3-hud:empty { display: none; }
body.compact .panel-head p { font-size: clamp(14px, 1.25vw, 17px); max-height: 7.2em; overflow-y: auto; padding-bottom: 1.2em; scrollbar-width: thin; }
body.compact .panel-head p.more { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
body.compact #personCard { display: none !important; }
.list-title { font-weight: 800; font-size: 16px; opacity: 0.8; margin-top: 4px; }
.place-list { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.place-list .chip { flex: none; }
.place-list .chip { font-size: 16px; padding: 10px 18px; }
.place-list .chip.on { border-color: var(--pin); }
#personActions { justify-content: flex-start; margin: 4px 0 12px; }
.people-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.people-list button {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border: 2px solid var(--line);
  background: var(--card-2);
  border-radius: 18px;
  padding: 12px 14px;
}
.people-list .avatar { width: 46px; height: 46px; font-size: 17px; }
.people-list .name { font-weight: 800; font-size: 17px; line-height: 1.2; }
.people-list .role { font-size: 14px; opacity: 0.75; }
[hidden] { display: none !important; }

/* Mischievous character: a sly half-closed eye and a crooked smirk (moods still take over when they play) */
body.char-mischievous:not([class*="mood-"]) .eye:first-child { transform: scaleY(0.55) translateY(12%); border-radius: 30% 30% 999px 999px; }
body.char-mischievous:not([class*="mood-"]) .mouth { transform: rotate(-9deg) translateX(18%); width: min(7vw, 10vh); }
.eye.wink { transform: scaleY(0.07) !important; transition: transform 0.12s ease !important; }

/* face moods (handshake reactions) */
body.mood-happy .eye { height: min(6vw, 9vh); border-radius: 999px 999px 20% 20%; transform: translateY(2vh); }
body.mood-ouch .eye { height: min(1.6vw, 2.6vh); border-radius: 6px; }
body.mood-ouch .eyes { gap: min(14vw, 20vh); }
body.mood-wow .eye { width: min(13vw, 19vh); height: min(13vw, 19vh); }
body.mood-wow .mouth { width: min(4vw, 6vh); height: min(4vw, 6vh); }
body.mood-meh .eye { height: min(7vw, 10vh); border-radius: 25% 25% 999px 999px; }
body.mood-meh .mouth { width: min(3vw, 4vh); }
.hs-toast { position: fixed; left: 2vw; bottom: 5vh; z-index: 7; background: var(--card-2); color: var(--card-text); border: 2px solid var(--line); border-radius: 14px; padding: 10px 16px; font-weight: 700; font-size: clamp(14px, 1.4vw, 18px); max-width: 44vw; }
.hs-toast[hidden] { display: none; }
.ms-card, .live-card { position: fixed; left: 2vw; top: 13vh; z-index: 7; background: var(--card-2); color: var(--card-text);

<script>
/* =========================================================
   SETTINGS (company, floors, places and people go in office-info.txt)
   ========================================================= */
const CONFIG = {
  infoFile: "office-info.txt",
  logoImage: "",                    // e.g. "logo.png". Blank = show the company name as text

  useAI: true,                      // false = answer straight from the document (fast, no Ollama)
  ollamaUrl: "http://localhost:11434/api/chat",
  model: "auto",                    // "auto" = the smartest model this PC can run fast (see kiosk-manifest.json), or a
                                    // name from `ollama list` such as "qwen3:4b-instruct" (plain "qwen3:4b" thinks out loud, slow);
                                    // on a PC with less than 8 GB memory use "qwen2.5:1.5b" or "qwen2.5:0.5b"
  internet: true,                   // let Cubot look things up online (news, weather, general questions). Needs
                                    // kiosk-server.py running (start-kiosk.bat does it). Add a free Ollama key to
                                    // office-info.txt [INTERNET] for full web search; without it, Wikipedia + weather only.

  botName: "Cubot",
  companyName: "SPACElogic",
  character: "friendly",            // how Cubot talks: "friendly" or "mischievous" (cheeky, teasing, sly jokes)
  characterSwitch: true,            // show the Friendly / Mischievous switch at the top of the screen
  quickQuestions: [                 // extra buttons. label = button text, ask = question sent
    { label: "About us", ask: "Tell me about SPACElogic" },
    { label: "Opening hours", ask: "What are your opening hours?" }
  ],

  voiceHint: "auto",                // "auto" = the cutest voice this PC has (list below). Or part of a voice name, e.g. "Zira".
                                    // Easiest: type "change voice" on the kiosk (or press F8), listen, and tap "Use this voice".
  cuteVoices: [                     // tried in this order when voiceHint is "auto"
    { match: "Ana Online", pitch: 1.1, rate: 1.0 },             // a child's voice: Microsoft Edge only, needs internet
    { match: "Google US English", pitch: 1.35, rate: 1.05 },    // Chrome, needs internet
    { match: "Google UK English Female", pitch: 1.3, rate: 1.05 },
    { match: "Zira", pitch: 1.6, rate: 1.1 }                    // built into Windows, works offline
  ],
  speechLang: "en-US",
  speechRate: 1.05,                 // used with voiceHint set to a name
  speechPitch: 1.3,                 // 1 = normal, higher = cuter (max 2)
  handsFree: false,
  resetAfterSec: 45,                // back to the welcome screen after this much inactivity
  start3D: true,                    // try 3D first; falls back to the 2D map if this PC can't show 3D
  startView: "walk",                // "walk" = walk-through (first person), "overview" = whole building, "2d" = flat map
  hideCursor: false,                // true for touch screens

  wakeWord: "auto",                 // always listen for "Hey Cubot". "auto" = on this PC if it can, otherwise the browser's
                                    // online speech service (Google in Chrome). "local" = only on this PC, "off" = tap or type only
  bargeIn: true,                    // saying "Hey Cubot" while she is talking stops her and she listens to you
  wakeAliases: ["cube bot", "q bot", "cue bot", "queue bot", "cute bot", "cool bot", "cubit", "qubit", "kubo", "kubot",
                "cubo", "cuba", "cube", "cubert", "kubert"],    // what speech recognition sometimes hears instead of the name

  faceMemory: true,                 // remember faces of people who say "remember me" (and agree), and greet them by name.
                                    // Only numbers describing the face are kept, in kiosk-settings.json on this PC. No photos.
  faceMatch: 0.5,                   // how close a face must be to count as the same person (lower = stricter)
  greetPeople: true,                // say hello when the camera sees a face close to the kiosk (nothing is saved or sent)
  greetFaceSize: 0.06,              // how close: face width as a share of the camera picture. 0.06 is about 1.8 m with a normal
                                    // webcam, 0.1 about 1 m; bigger = closer. Press F9 on the kiosk to see your face size live
  greetAfterAwaySec: 20,            // greet again only after nobody has been close for this long

  handshake: {                      // the handshake hand (ESP32-C3) in the Makerspace: Cubot reads its data for reports only
    enabled: true,                  // ("how many handshakes today?", the 5 pm summary). No live reactions, no game.
    device: "handshake-1",
    place: "Makerspace"
  },
  extraAliases: {                   // more words for places in office-info.txt (added to its own list)
    "Team T office": ["makerspace", "maker space", "makers space", "the makerspace"]
  },
  makerspace: {                     // tool scale, storage map, stock and light timer from Supabase
    enabled: true,
    summaryAt: "17:00",             // weekday end-of-day reminder: tools still out + handshake of the day ("" = off)
    liveCard: true,                 // "Makerspace live" card on the welcome screen when nobody is around
    toolNotes: true,                // a note on screen when a tool is taken out or put back
    roomPlaces: { "MAKER SPACE": "Team T office" }   // storage room -> office place, for "show me the way"
  },
  lights: {                         // office lights (the ESP32 smart switch). Works only on the office network
    url: "https://ogxuwchojexznsxvvdhi.supabase.co",
    key: "sb_publishable_pB5HMEXMjVDQiNcWlenV1A_ETc2qaNP",
    room: "Makerspace",
    names: ["Ceiling lights", "Wall spotlights"],                    // light 1 = left switch, light 2 = right switch
    words: [["ceiling", "square", "ring", "main", "white"], ["wall", "spot", "spotlight", "spotlights", "warm"]],   // "square light", "wall light", "spotlight"...
    button: true,                   // show a Lights button on the welcome screen
    pin: ""                         // e.g. "2580" so only staff can switch the lights. Blank = anyone at the kiosk can
  }
};
/* This PC's own settings live in kiosk-config.json (kiosk-server.py mixes them in), so GitHub updates never
   overwrite them. Example kiosk-config.json:  { "model": "qwen3:8b", "greetPeople": false, "lights": { "pin": "1234" } } */
(function applyOverrides(target, extra) {
  for (const [k, v] of Object.entries(extra || {})) {
    if (v && typeof v === "object" && !Array.isArray(v) && target[k] && typeof target[k] === "object" && !Array.isArray(target[k])) applyOverrides(target[k], v);
    else target[k] = v;
  }
})(CONFIG, window.KIOSK_OVERRIDES);
/* ========================================================= */

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const SETUP = Q.has("setup");
const VOICES = Q.has("voices");
let state = "idle";
let history = [];
let lastActivity = Date.now();
let resetDone = true;
let speakQueue = [];
let streamDone = true;
let INFO = { chunks: [], floors: [], locations: [], people: [], here: null, kioskDirs: {} };
let guideOffer = null, onScreenPerson = null, peopleGuide = false;   // see introducePerson()
let viewFloor = null;
let panelTarget = null;
const statusNotes = {};
const WAKE = { on: false, local: false, rec: null, running: false, hold: false, armedUntil: 0, inUtterance: false, muteUntil: 0, retryMs: 400, forceCloud: false, heard: "", heardAt: 0, matched: "" };
const SEE = { on: false, fd: null, video: null, stream: null, busy: false, paused: false, hits: 0, awayFor: 0, arrived: 0, greeted: false, lastNear: 0, lastWidth: 0, lastFrame: 0, lastGreet: 0, resumeTimer: 0 };
let faceLook = 0;

const ICON = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.700 1.100-2.200A6 6 0 0 0 12 3z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V11M16 11V8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3 15.5a1.6 1.6 0 0 1 2.4-2.1L7 15"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>'
};

/* ---------------- Read the document ---------------- */
function parseInfo(text) {
  const sections = {};
  let current = "GENERAL";
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, "");
    if (/^\s*#/.test(line)) continue;
    const head = line.match(/^\s*\[(.+?)\]\s*$/);
    if (head) { current = head[1].trim().toUpperCase(); continue; }
    (sections[current] = sections[current] || []).push(line);
  }
  const rows = name => (sections[name] || []).filter(l => l.trim()).map(l => l.split("|").map(s => s.trim()));
  const list = s => (s || "").split(",").map(x => x.trim().toLowerCase()).filter(Boolean);

  const floors = rows("FLOORS").filter(p => p[0] && !isNaN(parseFloat(p[0])))
    .map(p => ({ n: parseFloat(p[0]), name: p[1] || "Level " + p[0], map: p[2] || "" }));
  if (!floors.length) floors.push({ n: 1, name: "Office", map: "office-map.svg" });

  let here = { floor: floors[0].n, x: NaN, y: NaN, name: "" };
  let hereName = (Q.get("here") || "").replace(/[_+]/g, " ").trim();      // ?here=Main entrance overrides the file
  const hereLine = (sections["YOU ARE HERE"] || []).find(l => l.trim());
  if (!hereName && hereLine) {
    const n = hereLine.split(/[,|\s]+/).map(parseFloat).filter(v => !isNaN(v));
    if (n.length >= 3) here = { floor: n[0], x: n[1], y: n[2], name: "" };
    else if (n.length === 2) here = { floor: floors[0].n, x: n[0], y: n[1], name: "" };
    else hereName = hereLine.trim();
  }

  const locations = rows("LOCATIONS").filter(p => p[0]).map(p => {
    const multi = p.length >= 6 && !isNaN(parseFloat(p[2]));   // Name | words | level | directions | x | y
    return {
      name: p[0],
      aliases: list(p[1]),
      floor: multi ? parseFloat(p[2]) : here.floor,
      directions: (multi ? p[3] : p[2]) || "",
      x: parseFloat(multi ? p[4] : p[3]),
      y: parseFloat(multi ? p[5] : p[4])
    };
  });

  for (const [name, words] of Object.entries(CONFIG.extraAliases || {})) {
    const loc = locations.find(l => l.name.toLowerCase() === name.toLowerCase());
    if (loc) loc.aliases.push(...words.map(w => w.toLowerCase()).filter(w => !loc.aliases.includes(w)));
  }
  if (hereName) {
    const spot = locations.find(l => l.name.toLowerCase() === hereName.toLowerCase());
    if (spot) here = { floor: spot.floor, x: spot.x, y: spot.y, name: spot.name };
    else setTimeout(() => setStatus(`Kiosk spot "${hereName}" is not in [LOCATIONS]. Check the name under [YOU ARE HERE].`), 500);
  }
  const kioskDirs = {};
  for (const [name, lines] of Object.entries(sections)) {
    const m = name.match(/^KIOSK DIRECTIONS\s*:\s*(.+)$/);
    if (!m || m[1].trim().toLowerCase() !== (here.name || "").toLowerCase()) continue;
    for (const l of lines) {
      const i = l.indexOf("|");
      if (i > 0) kioskDirs[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim();
    }
  }

  const lights = {};
  rows("LIGHTS").forEach(p => {
    const k = (p[0] || "").toLowerCase();
    if (/^light [12]$/.test(k)) lights[k] = { name: p[1] || "", words: list(p[2]) };
    else if (k) lights[k] = p[1] || "";
  });
  const telegram = {};
  rows("TELEGRAM").forEach(p => { if (p[0]) telegram[p[0].toLowerCase()] = p[1] || ""; });
  const stairs = rows("STAIRS").filter(p => !isNaN(parseFloat(p[0])) && !isNaN(parseFloat(p[1])))
    .map(p => ({ from: parseFloat(p[0]), to: parseFloat(p[1]), how: p[2] || "", name: p[3] || "stairs" }));

  const people = rows("PEOPLE").filter(p => p[0]).map(p => ({
    name: p[0], role: p[1] || "", place: p[2] || "", aliases: list(p[3]), telegram: (p[4] || "").trim()
  })).sort((a, b) => a.name.localeCompare(b.name));

  const chunks = [];
  for (const [name, lines] of Object.entries(sections)) {
    if (["LOCATIONS", "PEOPLE", "YOU ARE HERE", "FLOORS", "STAIRS", "TELEGRAM", "LIGHTS", "INTERNET"].includes(name) || name.startsWith("KIOSK DIRECTIONS")) continue;
    const paras = lines.join("\n").split(/\n\s*\n/).map(s => s.replace(/\s+/g, " ").trim()).filter(Boolean);
    for (const para of paras) chunks.push({ text: para, words: new Set(words(name + " " + para)) });
  }
  return { chunks, floors, locations, people, here, kioskDirs, stairs, telegram, lights };
}

async function loadInfo() {
  try {
    const res = await fetch(CONFIG.infoFile + "?t=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    INFO = parseInfo(await res.text());
  } catch (e) {
    INFO.floors = [{ n: 1, name: "Office", map: "office-map.svg" }];
    INFO.here = { floor: 1, x: NaN, y: NaN };
    setStatus(`Can't load ${CONFIG.infoFile}. Keep it next to this page and open the page through http://localhost:8000`);
  }
  viewFloor = INFO.here.floor;
  buildFloorTabs();
  buildLists();
}

/* ---------------- Matching ---------------- */
const STOP = new Set(("a an the is are was were be been to of in on at for and or but with what who whom where when how why " +
  "do does did can could would should will you your yours our ours i me my we us it its this that these those there here " +
  "please tell about any have has had am im just want know like get some more much many so if then than also").split(" "));
function words(s) {
  return (s.toLowerCase().match(/[a-z0-9]+/g) || [])
    .filter(w => w.length > 1 && !STOP.has(w))
    .map(w => (w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w));
}
function findChunks(question, max = 3) {
  const q = words(question);
  return INFO.chunks
    .map(c => ({ c, score: q.reduce((n, w) => n + (c.words.has(w) ? 1 : 0), 0) }))
    .filter(r => r.score > 0)

  const t0 = performance.now();
  const floorAt = y => Math.round(y / FH) + 1;
  const loop = now => {
    const secs = (now - t0) / 1000;
    if (POV) {
      const cycle = secs % (walkTime + HOLD + 1);
      const u = Math.min(0.9995, Math.max(0, (cycle - 1) / walkTime));        // 1 s pause at the start
      const p = path.getPointAt(u), ahead = path.getPointAt(Math.min(0.9995, u + 6 / len));
      if (p && ahead) {
        camera.position.set(p.x, p.y + EYE, p.z);
        const d = ahead.clone().sub(p);
        const horiz = Math.hypot(d.x, d.z);
        if (horiz > 0.3) flatDir.set(d.x, 0, d.z).normalize();               // keep facing forward in the lift
        lookTarget.copy(camera.position).addScaledVector(flatDir, 10);
        if (horiz > 0.3) lookTarget.y = ahead.y + EYE - 0.8;                   // look up/down the stairs
        else lookTarget.y = camera.position.y - 1;
        look.lerp(lookTarget, look.lengthSq() ? 0.08 : 1);
        camera.lookAt(look);
        const fl = floorAt(p.y), name = floorOf(fl).name;
        for (const l of roomLabels) l.visible = l.userData.floor === fl && l.position.distanceTo(camera.position) < 45;
        const msg = cycle > 1 + walkTime ? `Arrived: ${person ? person.name : loc.name}` : `${name} · walking to ${person ? person.name : loc.name}`;
        if (msg !== lastHud) { hud.textContent = msg; lastHud = msg; }
      }
    } else {
      const t = (secs * 12 / len) % 1;
      walkers.forEach((w, i) => { const pt = path.getPointAt(Math.min(0.9995, (t + i / 3) % 1)); if (pt) w.position.copy(pt); });
      if (V3.controls) V3.controls.update();
    }
    goalCone.position.y = goalP.y + 2.2 * PS + Math.sin(now / 250) * 0.4 * PS;
    renderer.render(scene, camera);
    V3.raf = requestAnimationFrame(loop);
  };
  V3.raf = requestAnimationFrame(loop);
}
function size3D() {
  if (!V3.renderer || !V3.camera) return;
  const box = $("view3d"), W = box.clientWidth, H = box.clientHeight;
  V3.renderer.setSize(W, H);
  V3.camera.aspect = W / H;
  V3.camera.updateProjectionMatrix();
}

/* Offline text reader (Tesseract), loaded only when needed */
function loadOCR() {
  if (ocrWorker) return Promise.resolve(ocrWorker);
  if (ocrLoading) return ocrLoading;
  ocrLoading = new Promise((resolve, reject) => {
    const go = async () => {
      try {
        ocrWorker = await Tesseract.createWorker("eng", 1, {
          workerPath: "ocr/worker.min.js", corePath: "ocr", langPath: "ocr", gzip: true,
          logger: m => { if (m.status === "recognizing text" && !$("pcPhoto").hidden) $("pcStatus").textContent = `Reading… ${Math.round(m.progress * 100)}%`; }
        });
        resolve(ocrWorker);
      } catch (e) { ocrLoading = null; reject(e); }
    };
    if (window.Tesseract) return go();
    const s = document.createElement("script");
    s.src = "ocr/tesseract.min.js";
    s.onload = go;
    s.onerror = () => { ocrLoading = null; reject(new Error("ocr/tesseract.min.js not found")); };
    document.head.appendChild(s);
  });
  return ocrLoading;
}
async function readLabel(canvas) {
  let text = "";
  try {
    const w = await loadOCR();
    // grey + contrast helps with photos of labels
    const g = document.createElement("canvas"); g.width = canvas.width; g.height = canvas.height;
    const x = g.getContext("2d"); x.filter = "grayscale(1) contrast(1.6)"; x.drawImage(canvas, 0, 0);
    text = (await w.recognize(g)).data.text || "";
  } catch (e) { console.warn("OCR failed:", e); }
  $("pcStatus").textContent = "";
  const hits = matchLabel(text);
  chooseReceiver(hits, hits.length ? "Is the parcel for this person?" : "I couldn't read a staff name on the label. Please pick who it's for.");
}

/* Find staff names in messy label text (allows small reading mistakes) */
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function matchLabel(text) {
  const words = tokens(text.replace(/[0O](?=[a-z])/gi, "o"));
  const near = w => words.some(t => t === w || (w.length >= 4 && lev(t, w) <= 1) || (w.length >= 7 && lev(t, w) <= 2));
  const scored = INFO.people.map(p => {
    const nt = tokens(p.name);
    const hit = nt.filter(near).length;
    const score = hit === nt.length ? hit + 1 : hit >= 2 ? hit : (hit === 1 && nt.length === 1 ? 1.5 : 0);
    return { p, score };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
  if (!scored.length) return [];
  const best = scored[0].score;
  return scored.filter(r => r.score >= best - 0.5).slice(0, 4).map(r => r.p);
}

async function sendParcel(p) {
  parcelPicking = false;
  parcelUI("sending");
  $("pcText").textContent = "Letting HR know…";
  const { token, hr } = tgConfig();
  const when = new Date().toLocaleString("en-SG", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  const spot = INFO.here.name || floorOf(INFO.here.floor).name;
  const id = Date.now().toString(36);
  const caption = `📦 Parcel for ${p.name}${p.role ? " (" + p.role + ")" : ""}?\nArrived at the ${CONFIG.botName} kiosk (${spot}), ${when}.\nThe courier was asked to leave it at the HR office.\n\nPlease check the name on the label, then tap a button.`;
  let ok = false, problem = "";
  if (!token || !hr) problem = "Telegram isn't set up yet (see [TELEGRAM] in office-info.txt).";
  else {
    try {
      const keyboard = { inline_keyboard: [[{ text: `✅ Confirm, notify ${p.name}`, callback_data: `ok:${id}` }, { text: "✏️ Wrong person", callback_data: `no:${id}` }]] };
      let res;
      if (parcelPhoto) {
        const blob = await new Promise(r => parcelPhoto.toBlob(r, "image/jpeg", 0.85));
        const fd = new FormData();
        fd.append("chat_id", hr); fd.append("caption", caption); fd.append("photo", blob, "parcel.jpg");
        fd.append("reply_markup", JSON.stringify(keyboard));
        res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: "POST", body: fd });
      } else {
        res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: hr, text: caption, reply_markup: keyboard }) });
      }
      const j = await res.json();
      if (j.ok) { ok = true; tgStore.parcels[id] = { name: p.name, when, msg: j.result.message_id, photo: !!parcelPhoto }; tgSave(); }
      else problem = "Telegram said: " + (j.description || res.status);
    } catch (e) { problem = "Couldn't reach Telegram. Is the kiosk online?"; }
  }
  parcelUI("done");
  const hrLoc = INFO.locations.find(l => l.name.toLowerCase() === "hr office");
  if (ok) {
    $("pcText").textContent = "Message sent";
    $("pcDoneText").textContent = `Thank you! HR has been told and will let ${p.name} know. Please leave the parcel at the HR office.`;
    say(`Thank you! I've told HR, and they'll let ${p.name} know. Please leave the parcel at the HR office.${hrLoc ? " " + fullDirections(hrLoc) : ""}`, "Thank you! HR has been told. Please leave the parcel at the HR office.");
  } else {
    $("pcText").textContent = "Message not sent";
    $("pcDoneText").textContent = `I couldn't send the message. ${problem} Please leave the parcel at the HR office and let a staff member know.`;
    say(`Sorry, I couldn't send the message. Please leave the parcel at the HR office and let a staff member know.${hrLoc ? " " + fullDirections(hrLoc) : ""}`, "Sorry, I couldn't send the message. Please leave the parcel at the HR office.");
    setStatus(problem);
  }
  if (hrLoc) pcButton("Show me the way to HR", () => goToPlace(hrLoc), true);
  pcButton("Done", () => welcome());
}

/* ---------------------------------------------------------
   Telegram bot, run by the kiosk page itself (no server needed):
   - HR taps Confirm -> the bot messages the person privately
   - HR taps Wrong person -> HR replies with the right name
   - Staff register by opening the bot, tapping Start and sending their name
   Registrations are saved in the kiosk browser (and can be added to [PEOPLE] as a 5th column).
   --------------------------------------------------------- */
/* ---------------- Saved settings ----------------
   The chosen voice, timers, scheduled lights and Telegram sign-ups are saved in kiosk-settings.json next to
   this page (through kiosk-server.py), so they survive closing the kiosk, a restart, or switching browser.
   The browser's own storage is kept as a backup. */
const STORE = { data: {}, server: false, timer: 0 };
const LS_KEYS = { voice: "cubot-voice", telegram: "cubot-telegram", jobs: "cubot-jobs", character: "cubot-character", faces: "cubot-faces" };
async function storeLoad() {
  for (const [k, ls] of Object.entries(LS_KEYS)) {           // backup copy first
    try { const v = localStorage.getItem(ls); if (v) STORE.data[k] = JSON.parse(v); } catch (e) {}
  }
  try {
    const r = await fetch("/api/settings", { cache: "no-store", signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const d = await r.json();
      STORE.server = true;
      const fresh = !Object.keys(d).length;
      Object.assign(STORE.data, d);
      if (fresh && Object.keys(STORE.data).length) storeFlush();   // first time: move the old browser settings into the file
    }
  } catch (e) { /* old web server: browser storage only */ }
}
function storeGet(k) { return STORE.data[k]; }
function storeSet(k, v) {
  if (v === undefined || v === null) delete STORE.data[k]; else STORE.data[k] = v;
  try { if (v === undefined || v === null) localStorage.removeItem(LS_KEYS[k] || "cubot-" + k); else localStorage.setItem(LS_KEYS[k] || "cubot-" + k, JSON.stringify(v)); } catch (e) {}
  clearTimeout(STORE.timer);
  STORE.timer = setTimeout(storeFlush, 300);
}
function storeFlush() {
  if (!STORE.server) return;
  fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(STORE.data), keepalive: true }).catch(() => {});
}

let tgStore = { offset: 0, people: {}, parcels: {}, pending: {}, waitingName: {} };
function tgSave() {
  const ids = Object.keys(tgStore.parcels);                       // keep the last 200 parcels
  if (ids.length > 200) ids.slice(0, ids.length - 200).forEach(k => delete tgStore.parcels[k]);
  storeSet("telegram", tgStore);
}
function chatIdOf(person) {
  return person.telegram || tgStore.people[person.name] || "";
}
async function tg(method, body) {
  const { token } = tgConfig();
  const res = await fetch(`https://api.telegram.org/bot${token}/${method}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
}
async function tgEditStatus(rec, chatId, status) {
  const text = `📦 Parcel for ${rec.name}, ${rec.when}.\n${status}`;
  const body = { chat_id: chatId, message_id: rec.msg, reply_markup: { inline_keyboard: [] } };
  try { await tg(rec.photo ? "editMessageCaption" : "editMessageText", rec.photo ? { ...body, caption: text } : { ...body, text }); } catch (e) {}
}
async function tgNotify(person, rec) {
  const chat = chatIdOf(person);
  if (!chat) return false;
  const j = await tg("sendMessage", { chat_id: chat, text: `📦 Hi ${person.name}, a parcel has arrived for you (${rec.when}). Please collect it from the HR office.` });
  return !!j.ok;
}
const whoTapped = u => [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || "HR";

async function tgHandle(u) {
  const { hr } = tgConfig();
  // HR pressed a button under a parcel alert
  if (u.callback_query) {
    const cq = u.callback_query, [act, id] = (cq.data || "").split(":"), rec = tgStore.parcels[id];
    const chatId = cq.message && cq.message.chat.id;
    if (!rec) { await tg("answerCallbackQuery", { callback_query_id: cq.id, text: "This parcel is no longer in the list." }); return; }
    if (act === "ok") {
      const person = INFO.people.find(p => p.name === rec.name);
      const sent = person ? await tgNotify(person, rec) : false;
      await tg("answerCallbackQuery", { callback_query_id: cq.id, text: sent ? `${rec.name} has been notified.` : `${rec.name} hasn't joined the bot yet.` });
      await tgEditStatus(rec, chatId, sent
        ? `✅ Confirmed by ${whoTapped(cq.from)}. ${rec.name} has been notified.`
        : `✅ Confirmed by ${whoTapped(cq.from)}. ${rec.name} hasn't joined the bot, so please let them know.`);
      rec.done = true; tgSave();
    } else if (act === "no") {
      await tg("answerCallbackQuery", { callback_query_id: cq.id, text: "Reply to the alert with the right name." });
      await tgEditStatus(rec, chatId, `✏️ ${whoTapped(cq.from)} says this is the wrong person. Reply to this message with the right name.`);
      tgStore.pending[`${chatId}:${rec.msg}`] = id; tgSave();
    }
    return;
  }
  const m = u.message;
  if (!m || !m.text) return;
  const text = m.text.trim(), chat = m.chat;
  // HR replied to an alert with the right name
  if (m.reply_to_message && String(chat.id) === String(hr)) {
    const key = `${chat.id}:${m.reply_to_message.message_id}`, id = tgStore.pending[key], rec = tgStore.parcels[id];
    if (!rec) return;
    const hits = findPeople(text);
    if (hits.length !== 1) { await tg("sendMessage", { chat_id: chat.id, reply_to_message_id: m.message_id, text: hits.length ? `I found ${hits.length} people: ${hits.map(h => h.name).join(", ")}. Please reply with the full name.` : "I couldn't find that name in the staff list. Please reply with their full name." }); return; }
    rec.name = hits[0].name;
    const sent = await tgNotify(hits[0], rec);
    await tgEditStatus(rec, chat.id, sent ? `✅ Corrected by ${whoTapped(m.from)}. ${rec.name} has been notified.` : `✅ Corrected by ${whoTapped(m.from)} to ${rec.name}, who hasn't joined the bot, so please let them know.`);
    delete tgStore.pending[key]; rec.done = true; tgSave();
    return;
  }
  // Staff registering in a private chat with the bot
  if (chat.type !== "private") return;
  const cid = String(chat.id);
  if (/^\/stop\b/i.test(text)) {
    for (const [n, c] of Object.entries(tgStore.people)) if (c === cid) delete tgStore.people[n];
    tgSave();
    await tg("sendMessage", { chat_id: cid, text: "OK, I won't send you parcel alerts any more. Send /start to sign up again." });
    return;
  }
  if (/^\/start\b/i.test(text)) {
    tgStore.waitingName[cid] = true; tgSave();
    await tg("sendMessage", { chat_id: cid, text: `Hi! I'm ${CONFIG.botName}, the ${CONFIG.companyName} kiosk. I'll message you when a parcel arrives for you.\n\nPlease reply with your full name, as it appears in the company directory.` });
    return;
  }
  const hits = findPeople(text);
  if (hits.length === 1) {
    for (const [n, c] of Object.entries(tgStore.people)) if (c === cid) delete tgStore.people[n];
    tgStore.people[hits[0].name] = cid; delete tgStore.waitingName[cid]; tgSave();
    await tg("sendMessage", { chat_id: cid, text: `Thanks, ${hits[0].name}! You're signed up. I'll message you here when HR confirms a parcel for you. (Send /stop to turn this off.)` });
  } else {
    await tg("sendMessage", { chat_id: cid, text: hits.length ? `I found ${hits.length} people with that name: ${hits.map(h => h.name).join(", ")}. Please send your full name.` : "Sorry, I couldn't find that name in the staff list. Please send your full name, as it appears in the company directory." });
  }
}

let tgPolling = false;
async function tgPoll() {
  const { token } = tgConfig();
  if (!token || tgPolling || SETUP || VOICES || Q.has("telegram")) return;
  tgPolling = true;
  let wait = 2000;
  while (true) {
    try {
      const res = await fetch(`https://api.telegram.org/bot${token}/getUpdates?timeout=25&offset=${tgStore.offset}&allowed_updates=${encodeURIComponent('["message","callback_query"]')}`);
      const j = await res.json();
      if (j.ok) {
        wait = 2000;
        for (const u of j.result) {
          tgStore.offset = u.update_id + 1; tgSave();
          try { await tgHandle(u); } catch (e) { console.warn("Telegram update failed:", e); }
        }
        continue;
      }
      console.warn("Telegram:", j.description);
    } catch (e) { /* offline: try again later */ }
    await new Promise(r => setTimeout(r, wait));
    wait = Math.min(wait * 2, 60000);
  }
}

/* =========================================================
   OFFICE LIGHTS (the ESP32 smart switch, through Supabase)
   Works only from the office network: the database checks where the request comes from.
   ========================================================= */
let lightsUnlocked = false;
function lightsCfg() {
  const c = CONFIG.lights || {}, o = INFO.lights || {};

    const over = o["light " + ch];
    return {
      ch,
      name: (over && over.name) || (c.names || [])[ch - 1] || "Light " + ch,
      words: (over && over.words.length ? over.words : (c.words || [])[ch - 1]) || []
    };

  return { url: (c.url || "").replace(/\/$/, ""), key: c.key || "", room: o.room || c.room || "Office", pin: String(o["staff pin"] || c.pin || "").trim(),
    kioskKey: String(o["kiosk key"] || "").trim(), lights };
}
const lightsReady = () => { const c = lightsCfg(); return !!(c.url && c.key); };
async function lightsRead() {
  const c = lightsCfg();
  const res = await fetch(`${c.url}/rest/v1/smartlight?id=eq.1&select=state,state2,invert1,invert2`, { headers: { apikey: c.key }, cache: "no-store" });
  if (!res.ok) throw new Error("read " + res.status);
  const r = (await res.json())[0] || {};
  // a switch mounted upside down is marked "inverted", so its stored state is the opposite of the light
  const inv = { 1: !!r.invert1, 2: !!r.invert2 };
  return { inv, on: { 1: (r.state === "ON") !== inv[1], 2: (r.state2 === "ON") !== inv[2] } };

   internet line the office is using. Without a key, the lights only accept the office's known internet addresses. */
async function lightsSet(ch, on, inv) {
  const c = lightsCfg();
  const call = async (fn, extra) => {
    const res = await fetch(`${c.url}/rest/v1/rpc/${fn}`, {
      method: "POST", headers: { apikey: c.key, "Content-Type": "application/json" },
      body: JSON.stringify({ ...extra, ch, new_state: on !== inv ? "ON" : "OFF" })
    });
    if (!res.ok) { let m = ""; try { m = (await res.json()).message || ""; } catch (e) {} throw new Error(m || "error " + res.status); }
  };
  if (c.kioskKey) {
    try { return await call("light_set_kiosk", { p_key: c.kioskKey }); }
    catch (e) { if (e instanceof TypeError) throw e; setStatus("Lights: the kiosk key was not accepted (" + e.message + "). Trying the office network instead.", "lights"); }
  }

}
/* "turn off the wall lights" -> { chs: [2], on: false }.  action = null means just show the panel */
function lightsIntent(text) {
  if (!lightsReady() || !/\b(lights?|lamps?|spot ?lights?|lighting)\b/i.test(text)) return null;
  const c = lightsCfg(), t = norm(text);
  let chs = c.lights.filter(l => [l.name, ...l.words].some(w => { const n = norm(w).trim(); return n && t.includes(" " + n + " "); })).map(l => l.ch);
  if (!chs.length || /\b(all|both|every|everything)\b/i.test(text)) chs = [1, 2];
  const asking = /^\s*(is|are|was|were|what|which|why|how|do|does|did|where|who)\b/i.test(text);
  const off = /\b(off|close|shut)\b/i.test(text), on = /\b(on|open)\b/i.test(text);

}
function showOnly(boxId, title) {

  if (at) {                                  // "in 5 seconds" / "at 6pm": do it later (shown at the top of the screen)
    const short = chs.length === 2 ? "All lights" : c.lights[chs[0] - 1].name;
    addJob({ kind: "lights", at, total: Math.round((at - Date.now()) / 1000), label: `${short} ${on ? "on" : "off"}`, action: { chs, on } });
    $("ltText").textContent = `Scheduled: ${what} ${on ? "on" : "off"} ${when}. Tap × at the top to cancel.`;
    say(`OK, I'll turn ${on ? "on" : "off"} ${what} ${when}.`);

function lightsAskPin(action) {
  const c = lightsCfg();
  let typed = "";
  $("ltRows").hidden = true; $("ltBtns").innerHTML = ""; $("ltPin").hidden = false;
  $("ltText").textContent = "Staff only. Please enter the PIN.";
  say("The lights are for staff only. Please enter the PIN.", "Please enter the staff PIN.");
  const dots = () => { $("ltDots").textContent = "●".repeat(typed.length) + "○".repeat(Math.max(0, c.pin.length - typed.length)); };
  const keys = $("ltKeys");

/* =========================================================
   "HEY CUBOT": always listening for the wake phrase

const WAKE_GREET = new Set(["hey", "hay", "hi", "hello", "ok", "okay", "yo", "a", "eh", "ay", "hei", "hej", "oi"]);
/* Finds the name near the start of what was heard: "Hey Cubot, ...", "Cubot, ...", "hi cube bot ..." */
function wakeSplit(text) {
  const raw = text.trim().split(/\s+/), tk = raw.map(w => w.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const bot = tokens(CONFIG.botName).join("");
  const alias = new Set([bot, ...(CONFIG.wakeAliases || [])].map(a => tokens(a).join("")));
  const nameAt = i => {
    const one = tk[i], two = one + (tk[i + 1] || "");
    if (!one) return 0;
    if (tk[i + 1] && (alias.has(two) || lev(two, bot) <= 1)) return 2;     // two words first: "cube bot", "q bot"
    if (alias.has(one) || (one.length >= 4 && lev(one, bot) <= 1)) return 1;
    return 0;
  };
  for (let i = 0; i < Math.min(tk.length, 5); i++) {
    const n = nameAt(i);
    if (n && (i === 0 || WAKE_GREET.has(tk[i - 1]))) return { rest: raw.slice(i + n).join(" ") };
  }

}

    g.gain.setValueAtTime(0.12, a.currentTime);

}

}

}

}
function wakeOnResult(e) {

  const last = e.results[e.results.length - 1];
  if (last && last[0]) { WAKE.heard = (last[0].transcript || "").trim(); WAKE.heardAt = Date.now(); }
  const talking = (speakingNow || state === "speaking") && !countTalk;
  // "Hey Cubot" while I'm talking: stop and listen. Anything else I hear while talking is probably my own voice.
  if ((talking || state === "thinking") && CONFIG.bargeIn) { bargeCheck(e); return; }
  // never listen to my own voice, or while I'm still working on an answer
  if (talking || state === "thinking" || Date.now() < WAKE.muteUntil) return;
  if (countTalk && /^[\s\d.,!]*$|^\s*((one|two|three|four|five|six|seven|eight|nine|ten|zero|time'?s up)[\s.,!]*)+$/i.test(WAKE.heard)) return;   // my own countdown
  for (let i = e.resultIndex; i < e.results.length; i++) {

    if (!text) continue;
    const hit = wakeSplit(text), armed = Date.now() < WAKE.armedUntil;
    if (hit) {
      WAKE.matched = text;
      if (!WAKE.inUtterance && !armed) wakeBlip();
      WAKE.inUtterance = true;
      wakeArm();
      $("you").textContent = hit.rest ? "“" + hit.rest + "”" : "";
      if (r.isFinal) {
        WAKE.inUtterance = false;
        if (hit.rest.replace(/[^a-z0-9]/gi, "").length > 2) wakeRun(hit.rest);     // "Hey Cubot, where is the pantry?"
      }
    } else if (armed || WAKE.inUtterance) {
      WAKE.armedUntil = Date.now() + 8000;
      $("you").textContent = "“" + text + "”";
      if (r.isFinal) {
        const garbled = WAKE.inUtterance;          // the wake phrase was heard, then re-heard as something else

/* Interrupting: the wake phrase can come anywhere in what the mic heard (my own words may come first).
   Ignore it when I am saying my own name, or when what was heard is mostly what I'm saying (echo). */
function bargeCheck(e) {
  const r = e.results[e.results.length - 1];
  if (!r || !r[0]) return;
  const text = (r[0].transcript || "").trim(), words = text.split(/\s+/);
  const mine = tokens(nowSpeaking || "");
  const saysName = mine.some(w => wakeSplit(w) || wakeSplit("hey " + w));
  for (let i = 0; i < words.length; i++) {
    const hit = wakeSplit(words.slice(i).join(" "));
    if (!hit) continue;
    const before = tokens(words.slice(0, i).join(" ")), heard = tokens(words.slice(i).join(" "));
    const echo = heard.length > 2 && heard.filter(w => mine.includes(w)).length / heard.length > 0.6;
    if (saysName && !before.length && heard.length <= 2) return;                 // I'm saying "Cubot" myself
    if (echo) return;
    turnSeq++;                                                                     // drop the rest of my answer
    WAKE.inUtterance = true;
    wakeBlip();
    wakeArm();
    $("you").textContent = hit.rest ? "“" + hit.rest + "”" : "";
    WAKE.muteUntil = 0;
    if (r.isFinal && hit.rest.replace(/[^a-z0-9]/gi, "").length > 2) { WAKE.inUtterance = false; wakeRun(hit.rest); }

}

    if (cheeky()) say(pick(again ? [`${first}! Back so soon? You must really like me.`, `Oh look, it's ${first} again! Did you miss me?`, `${first}! I knew you couldn't stay away. Hee hee.`]
                                 : [`${hello}, ${first}! I never forget a face. Especially yours.`, `Psst, ${first}! ${hello}! I recognised you from a mile away.`, `Well well well, if it isn't ${first}! ${hello}!`]));
    else say(pick(again ? [`Hi again, ${first}! What can I do for you?`, `Welcome back, ${first}!`]
                        : [`${hello}, ${first}! Nice to see you again.`, `${hello}, ${first}! How can I help you today?`]));
    return;
  }
  if (cheeky()) {
    wink();
    const how = WAKE.on ? `Say, Hey ${name}, and ask me anything.` : "Tap a button or type a question.";
    say(pick([`${hello}! I'm ${name}. I saw you coming, you know. Welcome to ${CONFIG.companyName}! ${how}`,
              `Psst! ${hello}! I'm ${name}, the smartest robot in ${CONFIG.companyName}. Don't tell the humans. ${how}`,
              `${hello}! Welcome to ${CONFIG.companyName}. I'm ${name}, and I know everything around here. Well, almost. ${how}`]),
        WAKE.on ? `${hello}! Say “Hey ${name}” to ask me anything.` : `${hello}! How can I help you today?`);
    return;
  }
  if (WAKE.on) say(`${hello}! I'm ${name}. Welcome to ${CONFIG.companyName}! If you have a question, just say, Hey ${name}, and ask me.`,
                   `${hello}! Say “Hey ${name}” to ask me a question.`);
  else say(`${hello}! I'm ${name}. Welcome to ${CONFIG.companyName}! Tap a button or type a question to get started.`,
           `${hello}! Welcome to ${CONFIG.companyName}. How can I help you today?`);
}


/* =========================================================
   FACE MEMORY: "remember me" -> asks the name and permission -> learns the face -> greets them by name next time
   Uses face-api.js (vision/faces) on this PC only. What is kept is 128 numbers per face sample in
   kiosk-settings.json ("faces"), never a photo. "Forget me" deletes that person; "forget all faces" deletes everyone.
   ========================================================= */
const FACE = { ready: false, loading: null, ask: null, busy: false, current: null };
const faceList = () => storeGet("faces") || [];
function faceOn() { return CONFIG.faceMemory !== false && CONFIG.greetPeople !== false; }
async function faceLoad() {
  if (FACE.ready || !faceOn()) return FACE.ready;
  FACE.loading = FACE.loading || (async () => {
    try {
      if (!window.faceapi) await loadScript("vision/faces/face-api.js");
      try { await faceapi.tf.setBackend("webgl"); } catch (e) { await faceapi.tf.setBackend("cpu"); }
      await faceapi.tf.ready();
      await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri("vision/faces"), faceapi.nets.faceLandmark68Net.loadFromUri("vision/faces"),
                         faceapi.nets.faceRecognitionNet.loadFromUri("vision/faces")]);
      FACE.ready = true;
    } catch (e) {
      console.warn("Face memory is off:", e);
      setStatus("Face memory is off: " + (/not found/.test(e.message) ? "the vision/faces folder is missing." : "it couldn't start on this PC."), "face");
    }
    return FACE.ready;
  })();
  return FACE.loading;
}
/* one look through the camera: the biggest face's 128 numbers, or null */
async function faceRead() {
  if (!SEE.on || SEE.paused || !SEE.video || SEE.video.readyState < 2 || !(await faceLoad())) return null;
  while (FACE.busy) await new Promise(r => setTimeout(r, 80));
  FACE.busy = true;
  try {
    const all = await faceapi.detectAllFaces(SEE.video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 }))
      .withFaceLandmarks().withFaceDescriptors();
    if (!all.length) return null;
    all.sort((a, b) => b.detection.box.area - a.detection.box.area);
    return Array.from(all[0].descriptor);
  } catch (e) { console.warn("Face read:", e); return null; }
  finally { FACE.busy = false; }
}
function faceDist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; s += d * d; } return Math.sqrt(s); }
function faceMatch(desc) {
  let best = null, bestD = Infinity;
  for (const p of faceList()) for (const d of p.d) { const x = faceDist(desc, d); if (x < bestD) { bestD = x; best = p; } }
  return best && bestD < (CONFIG.faceMatch || 0.5) ? best : null;
}
/* who is in front of the camera right now (a few tries), or null */
async function faceWho(tries = 3) {
  if (!faceList().length) return null;
  for (let i = 0; i < tries; i++) {
    const d = await faceRead();
    if (d) { const p = faceMatch(d); if (p) return p; }
    await new Promise(r => setTimeout(r, 250));
  }
  return null;
}
function faceSeen(p) {
  const list = faceList(), q = list.find(x => x.id === p.id);
  if (!q) return;
  q.seen = Date.now();
  storeSet("faces", list);
  FACE.current = { name: q.name, at: Date.now() };
}
/* the greeting: by name if the face is known, otherwise the normal hello */
async function faceGreet() {
  if (!faceOn() || !faceList().length) { seeGreet(); return; }
  const t0 = Date.now();
  const p = await Promise.race([faceWho(2), new Promise(r => setTimeout(() => r(null), 2500))]);
  if (state !== "idle" || document.body.classList.contains("has-panel") || Date.now() - t0 > 4000) return;   // they started using the kiosk
  if (p) { const before = { ...p }; faceSeen(p); seeGreet(before); } else seeGreet();
}
/* who the AI is talking to (for its prompt) */
function faceTalking() {
  const c = FACE.current;
  return c && Date.now() - c.at < 5 * 60e3 && Date.now() - SEE.lastNear < 20e3 ? `${c.name} (recognised by face)` : "someone (not recognised)";
}
function faceBox(title, text, buttons) {
  showOnly("faceBox", title);
  $("fcText").textContent = text;
  const box = $("fcBtns"); box.innerHTML = "";
  for (const [label, fn, primary] of buttons) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip" + (primary ? " primary" : ""); b.textContent = label;
    b.addEventListener("click", () => { activity(); fn(); });
    box.appendChild(b);
  }
}
const cleanName = t => t.replace(/^\s*(?:hey\s+\w+,?\s*)?(?:ok(?:ay)?,?\s*)?(?:it'?s|i'?m|i am|my name is|my name'?s|call me|this is|name'?s|you can call me)\s+/i, "")
  .replace(/[.!?,]+$/, "").replace(/\b(please|thanks|thank you)\b/gi, "").trim();
function faceNameOk(n) { return n && n.length <= 40 && /^[\p{L}][\p{L} .'-]*$/u.test(n) && n.split(/\s+/).length <= 4; }
const titleCase = n => n.toLowerCase().replace(/(^|[\s'-])\p{L}/gu, m => m.toUpperCase());
/* step 1: "remember me" (with or without a name) */
function faceStart(name) {
  if (!faceOn()) { say("Sorry, face memory is switched off on this kiosk."); return; }
  if (!SEE.on) { say("Sorry, I can't see you. My camera isn't working right now."); return; }
  faceLoad();                                                  // start loading while we talk
  if (!faceNameOk(name)) {
    faceBox("Nice to meet you!", "What's your name? Say it, or type it below.", [["Cancel", () => { closePanel(); say("Okay, no problem!"); }]]);
    FACE.ask = { step: "name", until: Date.now() + 60e3 };          // after faceBox: opening the panel clears FACE.ask
    say(cheeky() ? "Ooh, a new friend! What's your name? I promise not to make fun of it. Much." : "I'd love to remember you! What's your name?");
    return;
  }
  faceConsent(name);
}
/* step 2: ask permission */
function faceConsent(raw) {
  const staff = findPeople(raw);
  const name = staff.length === 1 && tokens(staff[0].name).length > 1 && nameScore(tokens(raw), staff[0].name) >= 1.5 ? staff[0].name : titleCase(raw);
  const first = name.split(/\s+/)[0];
  const text = `Hi ${first}! Shall I remember your face, so I can greet you by name next time? I only keep numbers that describe your face, on this computer. No photo. Say "forget me" any time and I'll delete them.`;
  faceBox(`Remember ${name}?`, text, [["Yes, remember me", () => faceLearn(name), true], ["No thanks", faceNo]]);
  FACE.ask = { step: "consent", name, until: Date.now() + 60e3 };
  say(`Hi ${first}! Shall I remember your face, so I can greet you by name next time? I don't keep a photo, and you can say forget me any time.`);
}
function faceNo() { FACE.ask = null; closePanel(); say(cheeky() ? "Fine, stay mysterious! I like it." : "No problem! I won't remember your face."); }
/* step 3: learn the face (a few samples, looking at the screen) */
async function faceLearn(name) {
  FACE.ask = null;
  faceBox(`Learning ${name}'s face`, "Look at my eyes for a moment and stay still...", []);
  say("Great! Look at my eyes for a moment, and stay still.");
  const samples = [];
  const until = Date.now() + 9000;
  await new Promise(r => setTimeout(r, 1200));
  while (samples.length < 4 && Date.now() < until) {
    const d = await faceRead();
    if (d && !samples.some(x => faceDist(x, d) < 0.01)) samples.push(d);     // skip the same frame read twice
    await new Promise(r => setTimeout(r, 450));
  }
  if (samples.length < 2) {
    faceBox("I couldn't see you", "Please stand in front of me, facing the screen, and try again.", [["Try again", () => faceLearn(name), true], ["Cancel", () => closePanel()]]);
    say(FACE.ready ? "Hmm, I couldn't see your face clearly. Please face the screen and try again." : "Sorry, my face memory couldn't start on this computer.");
    return;
  }
  const list = faceList();
  const round = d => d.map(v => Math.round(v * 1000) / 1000);
  let p = list.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!p) { p = { id: Date.now().toString(36), name, d: [], added: new Date().toISOString().slice(0, 10), seen: 0 }; list.push(p); }
  p.d = p.d.concat(samples.map(round)).slice(-6);                            // keep the newest 6 samples
  p.seen = Date.now();
  if (list.length > 300) list.sort((a, b) => (b.seen || 0) - (a.seen || 0)).splice(300);
  storeSet("faces", list);
  FACE.current = { name, at: Date.now() };
  const first = name.split(/\s+/)[0];
  faceBox("All done!", `I'll recognise you next time, ${first}. Say "forget me" whenever you want me to delete your face.`, [["OK", () => closePanel(), true]]);
  mood("happy", 2500); wink();
  say(cheeky() ? `Got it, ${first}! Your face is now in my secret collection. Just kidding. Mostly.` : `Nice to meet you, ${first}! I'll remember you next time.`);
}
/* "forget me" */
async function faceForget() {
  if (!faceList().length) { say("I don't have anyone's face saved."); return; }
  say("Okay, let me look at you.");
  const p = await faceWho(4);
  if (!p) { say("I don't think I have your face saved, so there's nothing to forget."); return; }
  storeSet("faces", faceList().filter(x => x.id !== p.id));
  FACE.current = null;
  say(cheeky() ? `Poof! ${p.name.split(/\s+/)[0]}, who? I've forgotten your face.` : `Done, ${p.name.split(/\s+/)[0]}. I've deleted your face from my memory.`);
}
/* "who am I?" / "do you remember me?" */
async function faceWhoAmI() {
  if (!faceOn() || !SEE.on) { say("Sorry, I can't see you right now. My camera isn't working."); return; }
  say(cheeky() ? "Hmm, let me have a good look at you..." : "Let me have a look...");
  const p = await faceWho(4);
  if (p) { faceSeen(p); say(cheeky() ? `You're ${p.name}! Did you think I'd forget? Never.` : `You're ${p.name}! Nice to see you.`); }
  else say(`I don't think we've met yet. Say "remember me" and I'll learn your face.`);
}
function faceForgetAll() {
  const n = faceList().length;
  if (!n) { say("I don't have anyone's face saved."); return; }
  faceBox("Forget all faces?", `This deletes the ${n} face${n > 1 ? "s" : ""} I remember. Nobody will be greeted by name until they ask me again.`,
    [["Yes, forget everyone", () => { storeSet("faces", []); FACE.current = null; closePanel(); say("Done. I've forgotten every face."); }, true], ["Cancel", () => closePanel()]]);
  say(`Do you really want me to forget all ${n} faces?`);
}
/* typed or spoken commands; returns true when handled */
function faceCommand(text) {
  if (FACE.ask && Date.now() > FACE.ask.until) { FACE.ask = null; }
  if (FACE.ask && FACE.ask.step === "name") {
    if (/^\s*(no|cancel|never ?mind|stop)\b/i.test(text)) { closePanel(); say("Okay, no problem!"); return true; }
    const n = cleanName(text);
    if (faceNameOk(n)) { faceConsent(n); return true; }
    say("Sorry, I didn't catch that. What's your name?"); return true;
  }
  if (FACE.ask && FACE.ask.step === "consent") {
    if (/^\s*(yes|yeah|yep|sure|ok|okay|please|go ahead|of course|remember me)\b/i.test(text)) { faceLearn(FACE.ask.name); return true; }
    if (/^\s*(no|nope|nah|not now|don'?t|no thanks)\b/i.test(text)) { faceNo(); return true; }
  }
  if (!faceOn()) return false;
  if (/\bforget (all|every(one|body)'?s?|all the) faces?\b|\bforget everyone\b/i.test(text)) { faceForgetAll(); return true; }
  if (/\b(forget (me|my face|who i am)|delete my face|remove my face)\b/i.test(text)) { faceForget(); return true; }
  if (/^\s*(who am i|do you (know|remember|recogni[sz]e) (me|who i am)|what'?s my name|can you (recogni[sz]e|remember) me)\b/i.test(text)) { faceWhoAmI(); return true; }
  let m = text.match(/\b(?:remember|learn|save) (?:me|my face|my name)\b[\s,.!]*(?:(?:i'?m|i am|my name is|it'?s|as)\s+(.+))?$/i);
  if (m) { faceStart(m[1] ? cleanName(m[1]) : ""); return true; }
  m = text.match(/^\s*(?:hi|hello|hey)?[\s,!]*(?:my name is|my name'?s|call me)\s+(.+)$/i);
  if (m && faceNameOk(cleanName(m[1]))) { faceStart(cleanName(m[1])); return true; }
  return false;
}

/* =========================================================
   VOICE PICKER: type "change voice" on the kiosk, or press F8

function openVoicePicker() {
  showOnly("voiceBox", `Choose ${CONFIG.botName}'s voice`);
  const all = speechSynthesis.getVoices();
  const voices = all.filter(v => v.lang.startsWith("en"))
    .sort((a, b) => (CONFIG.cuteVoices.findIndex(c => b.name.includes(c.match)) > -1) - (CONFIG.cuteVoices.findIndex(c => a.name.includes(c.match)) > -1)
                    || (b.localService ? 0 : 1) - (a.localService ? 0 : 1) || a.name.localeCompare(b.name));
  const pitch = $("vcPitch"), rate = $("vcRate");
  const showVals = () => { $("vcPitchV").textContent = (+pitch.value).toFixed(2); $("vcRateV").textContent = (+rate.value).toFixed(2); };
  pitch.value = voicePitch; rate.value = voiceRate; showVals();
  pitch.oninput = rate.oninput = () => { activity(); showVals(); };
  const list = $("vcList"); list.innerHTML = "";
  if (!voices.length) list.textContent = "No voices found yet. Close this and try again in a few seconds.";
  for (const v of voices) {
    const preset = CONFIG.cuteVoices.find(c => v.name.includes(c.match));
    const row = document.createElement("div");
    row.className = "vc-row" + (voice && v.name === voice.name ? " on" : "");
    row.innerHTML = '<div class="vc-name"><span class="vc-sub"></span></div>';
    row.querySelector(".vc-name").prepend(v.name.replace(/^(Microsoft|Google) /, "").replace(/ - English.*$/, ""));
    row.querySelector(".vc-sub").textContent = (v.localService ? "Works offline" : "Needs internet") + (preset ? " · cute pick" : "");
    const listen = document.createElement("button");
    listen.type = "button"; listen.className = "chip"; listen.textContent = "Listen";
    listen.onclick = () => {
      activity();
      if (preset && !row.dataset.tried) { pitch.value = preset.pitch; rate.value = preset.rate; showVals(); }
      row.dataset.tried = "1";
      speakSample(v, +pitch.value, +rate.value);
    };
    const pick = document.createElement("button");
    pick.type = "button"; pick.className = "chip primary"; pick.textContent = "Use this voice";
    pick.onclick = () => {
      activity();
      storeSet("voice", { name: v.name, pitch: +pitch.value, rate: +rate.value });
      pickVoice();
      list.querySelectorAll(".vc-row").forEach(r => r.classList.remove("on"));
      row.classList.add("on");
      say("Yay! This is my new voice.", "Saved! This is my new voice.");
    };
    row.append(listen, pick);
    list.appendChild(row);
  }
  $("vcBtns").innerHTML = "";
  const auto = document.createElement("button");
  auto.type = "button"; auto.className = "chip"; auto.textContent = "Back to automatic";
  auto.onclick = () => { activity(); storeSet("voice", null); pickVoice(); openVoicePicker(); say("OK, back to my automatic voice."); };
  $("vcBtns").appendChild(auto);
  $("vcText").textContent = "Tap Listen to hear a voice, adjust pitch and speed, then tap Use this voice.";
  say("Pick a voice for me. Tap listen to hear each one.", "Pick a voice for me.");
}
function speakSample(v, pitch, rate) {
  stopTalking();
  const u = new SpeechSynthesisUtterance(`Hi! I'm ${CONFIG.botName}. Welcome to ${CONFIG.companyName}!`);
  u.voice = v; u.lang = v.lang; u.pitch = pitch; u.rate = rate;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => setState("idle");
  speechSynthesis.speak(u);
}
