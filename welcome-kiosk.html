/* =========================================================
   "HEY CUBOT": always listening for the wake phrase
   "local" keeps the sound on this PC (Chrome's on-device speech recognition).
   ========================================================= */
const WAKE_GREET = new Set(["hey", "hay", "hi", "hello", "ok", "okay", "yo", "a", "eh", "ay", "hei", "hej", "oi"]);
/* Finds the name near the start of what was heard: "Hey Cubot, ...", "Cubot, ...", "hi cube bot ..." */
function wakeSplit(text) {
  const raw = text.trim().split(/\s+/), tk = raw.map(w => w.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const bot = tokens(CONFIG.botName).join("");
  const alias = new Set([bot, ...(CONFIG.wakeAliases || [])].map(a => tokens(a).join("")));
  const nameAt = i => {
    const one = tk[i], two = one + (tk[i + 1] || "");
    if (!one) return 0;
    if (tk[i + 1] && (alias.has(two) || lev(two, bot) <= 1)) return 2;     // two words first: "cube bot", "q bot"
    if (alias.has(one) || (one.length >= 4 && lev(one, bot) <= 1)) return 1;
    return 0;
  };
  for (let i = 0; i < Math.min(tk.length, 5); i++) {
    const n = nameAt(i);
    if (n && (i === 0 || WAKE_GREET.has(tk[i - 1]))) return { rest: raw.slice(i + n).join(" ") };
  }
  return null;
}
function wakeBlip() {
  try {
    const a = wakeBlip.ctx || (wakeBlip.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.12, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.18);
    o.start(); o.stop(a.currentTime + 0.2);
  } catch (e) {}
}
function wakeArm(ms = 8000) {
  WAKE.armedUntil = Date.now() + ms;
  stopTalking();
  setState("listening");
  activity();
}
function wakeDisarm() {
  WAKE.armedUntil = 0; WAKE.inUtterance = false;
  if (state === "listening") setState("idle");
}
function wakeRun(text) {
  WAKE.armedUntil = 0; WAKE.inUtterance = false;
  setState("idle");
  handleUserText(text);
}
function wakeOnResult(e) {
  WAKE.retryMs = 400;
  const last = e.results[e.results.length - 1];
  if (last && last[0]) { WAKE.heard = (last[0].transcript || "").trim(); WAKE.heardAt = Date.now(); }
  // never listen to my own voice, or while I'm still working on an answer
  if (((speakingNow || state === "speaking") && !countTalk) || state === "thinking" || Date.now() < WAKE.muteUntil) return;
  if (countTalk && /^[\s\d.,!]*$|^\s*((one|two|three|four|five|six|seven|eight|nine|ten|zero|time'?s up)[\s.,!]*)+$/i.test(WAKE.heard)) return;   // my own countdown
  for (let i = e.resultIndex; i < e.results.length; i++) {
    const r = e.results[i], text = (r[0].transcript || "").trim();
    if (!text) continue;
    const hit = wakeSplit(text), armed = Date.now() < WAKE.armedUntil;
    if (hit) {
      WAKE.matched = text;
      if (!WAKE.inUtterance && !armed) wakeBlip();
      WAKE.inUtterance = true;
      wakeArm();
      $("you").textContent = hit.rest ? "“" + hit.rest + "”" : "";
      if (r.isFinal) {
        WAKE.inUtterance = false;
        if (hit.rest.replace(/[^a-z0-9]/gi, "").length > 2) wakeRun(hit.rest);     // "Hey Cubot, where is the pantry?"
      }
    } else if (armed || WAKE.inUtterance) {
      WAKE.armedUntil = Date.now() + 8000;
      $("you").textContent = "“" + text + "”";
      if (r.isFinal) {
        const garbled = WAKE.inUtterance;          // the wake phrase was heard, then re-heard as something else
        WAKE.inUtterance = false;
        if (!garbled) wakeRun(text);
      }
    }
  }
}
function wakeStart() {
  if (!WAKE.on || WAKE.hold || WAKE.running) return;
  try { WAKE.rec.start(); } catch (e) {}
}
function wakePause() { if (!WAKE.on) return; WAKE.hold = true; try { WAKE.rec.abort(); } catch (e) {} }
function wakeResume() { if (!WAKE.on || !WAKE.hold) return; WAKE.hold = false; WAKE.muteUntil = Date.now() + 500; setTimeout(wakeStart, 350); }
function wakeOff(why) {
  WAKE.on = false;
  try { WAKE.rec && WAKE.rec.abort(); } catch (e) {}
  setStatus(why, "wake");
  if (state === "idle") setState("idle");
}
async function wakeInit(retry) {
  const name = `"Hey ${CONFIG.botName}"`;
  if (WAKE.on) return;
  if (!CONFIG.wakeWord || CONFIG.wakeWord === "off") return;
  if (!SR) { setStatus(`${name} is off: this browser has no speech recognition. Use Chrome.`, "wake"); return; }
  const lang = CONFIG.speechLang;
  let local = false;
  // If the browser crashed while checking for on-device speech last time, don't try again (avoids a crash loop)
  let crashedBefore = false;
  try { crashedBefore = localStorage.getItem("cubot-wake-check") === "1"; } catch (e) {}
  if (typeof SR.available === "function" && !crashedBefore && !WAKE.forceCloud) {
    try {
      try { localStorage.setItem("cubot-wake-check", "1"); } catch (e) {}
      let st = await SR.available({ langs: [lang], processLocally: true });
      if (st === "downloadable" || st === "downloading") {
        setStatus("Getting the on-device speech pack (one time, needs internet)…", "wake");
        st = (await SR.install({ langs: [lang], processLocally: true })) ? "available" : "unavailable";
      }
      local = st === "available";
      try { localStorage.removeItem("cubot-wake-check"); } catch (e) {}
    } catch (e) {
      try { localStorage.removeItem("cubot-wake-check"); } catch (e2) {}
      console.warn("On-device speech:", e);
      if (!retry) { document.addEventListener("pointerdown", () => wakeInit(true), { once: true }); }   // some browsers only allow the download after a tap
    }
  }
  if (!local && CONFIG.wakeWord === "local") {
    setStatus(crashedBefore
      ? `${name} is off: checking for on-device speech stopped the browser last time. Set wakeWord: "cloud" or "off".`
      : `${name} is off: this browser can't recognise speech on the PC itself. Open the kiosk in Chrome, or set wakeWord: "cloud".`, "wake");
    return;
  }
  WAKE.local = local;
  if (local && recog) recog.processLocally = true;                 // tap-to-talk stays on this PC too
  const rec = WAKE.rec = new SR();
  rec.lang = lang; rec.continuous = true; rec.interimResults = true;
  if (local) {
    rec.processLocally = true;
    try { rec.phrases = [new SpeechRecognitionPhrase(`Hey ${CONFIG.botName}`, 8)]; } catch (e) {}
  }
  rec.onstart = () => { WAKE.running = true; };
  rec.onresult = wakeOnResult;
  rec.onend = () => { WAKE.running = false; if (WAKE.on && !WAKE.hold) setTimeout(wakeStart, WAKE.retryMs); };
  rec.onerror = e => {
    if (["not-allowed", "service-not-allowed", "audio-capture"].includes(e.error)) wakeOff(`${name} is off: no microphone found.`);
    else if (e.error === "language-not-supported") {
      if (WAKE.local && CONFIG.wakeWord !== "local") {             // the offline pack failed: use the online service instead
        WAKE.on = false; WAKE.forceCloud = true;
        try { rec.abort(); } catch (e2) {}
        setTimeout(wakeInit, 500);
      } else wakeOff(`${name} is off: the speech pack for ${lang} isn't installed.`);
    }
    else if (e.error === "network") WAKE.retryMs = Math.min(WAKE.retryMs * 2, 60000);
  };
  WAKE.on = true;
  setStatus("", "wake");
  if (state === "idle") setState("idle");
  wakeStart();
}
setInterval(() => {
  if (WAKE.on && WAKE.armedUntil && !WAKE.inUtterance && Date.now() > WAKE.armedUntil) wakeDisarm();
}, 500);

/* =========================================================
   GREETING: the camera notices a face close to the kiosk
   Runs on this PC only. No picture is saved or sent anywhere, and nobody is identified.
   ========================================================= */
function loadScript(src) {
  return new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => no(new Error(src + " not found"));
    document.head.appendChild(s);
  });
}
async function seeCamera() {
  SEE.stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 10 } }, audio: false });
  SEE.video.srcObject = SEE.stream;
  await SEE.video.play();
}
async function seeInit() {
  if (!CONFIG.greetPeople) return;
  try {
    if (!navigator.mediaDevices) throw new Error("no camera support");
    if (!window.FaceDetection) await loadScript("vision/face_detection.js");
    const fd = new FaceDetection({ locateFile: f => "vision/" + f });
    fd.setOptions({ model: "full", minDetectionConfidence: 0.55 });     // "full" also sees faces a few metres away
    fd.onResults(seeResults);
    await Promise.race([fd.initialize(), new Promise((_, no) => setTimeout(() => no(new Error("face detector didn't start")), 30000))]);
    SEE.fd = fd;
    SEE.video = document.createElement("video");
    SEE.video.muted = true; SEE.video.playsInline = true;
    await seeCamera();
    SEE.on = true;
    setInterval(seeTick, 450);
  } catch (e) {
    console.warn("Greeting is off:", e);
    setStatus(/not found$/.test(e.message) ? "Greeting is off: the vision folder is missing."
      : /NotFound|NotAllowed|NotReadable|Overconstrained|camera/i.test(e.name + e.message) ? "Greeting is off: no camera found."
      : "Greeting is off: the face detector couldn't start on this PC.", "see");
  }
}
function seePause() {
  if (!SEE.on || SEE.paused) return;
  SEE.paused = true;
  if (SEE.stream) SEE.stream.getTracks().forEach(t => t.stop());
  SEE.stream = null;
}
function seeResume() {
  if (!SEE.on || !SEE.paused) return;
  clearTimeout(SEE.resumeTimer);
  SEE.resumeTimer = setTimeout(async () => {
    if (camStream || !SEE.paused) return;                 // the parcel camera is in use again
    try { await seeCamera(); SEE.paused = false; } catch (e) { SEE.resumeTimer = setTimeout(seeResume, 5000); }
  }, 700);
}
async function seeTick() {
  if (!SEE.on || SEE.paused || SEE.busy || document.hidden || SEE.video.readyState < 2 || !$("parcelBox").hidden) return;
  SEE.busy = true;
  try { await SEE.fd.send({ image: SEE.video }); } catch (e) { console.warn("Face detector:", e); }
  SEE.busy = false;
}
function seeResults(res) {
  const now = Date.now();
  const faces = (res.detections || []).map(d => d.boundingBox).filter(Boolean).sort((a, b) => b.width - a.width);
  SEE.lastWidth = faces.length ? faces[0].width : 0;
  SEE.lastFrame = now;
  const near = faces.find(b => b.width >= CONFIG.greetFaceSize);
  if (!near) return;
  if (now - SEE.lastNear > 2500) {                         // a new arrival: nobody was near for 2.5 s (a missed frame or two is fine)
    SEE.awayFor = SEE.lastNear ? now - SEE.lastNear : Infinity;
    SEE.arrived = now;
    SEE.hits = 0;
    SEE.greeted = false;
  }
  SEE.hits++;
  SEE.lastNear = now;
  if (!resetDone) lastActivity = now;                     // someone is still here: don't reset the screen under them
  const panel = document.body.classList.contains("has-panel");
  if (!panel && now - pointerLook > 2500) {               // eyes follow the person (the camera picture is not mirrored)
    faceLook = now;
    look(-(near.xCenter - 0.5) * 64, (near.yCenter - 0.5) * 28);
  }
  // greet once per visit, when nobody has been near for a while and the screen isn't in use
  if (!SEE.greeted && SEE.hits >= 2 && SEE.awayFor > CONFIG.greetAfterAwaySec * 1000 && now - SEE.arrived < 10000
      && state === "idle" && !panel && !$("typeBox").value) {
    SEE.greeted = true;
    SEE.lastGreet = now;
    if (!resetDone) welcome();
    seeGreet();
  }
}
function seeGreet() {
  const h = new Date().getHours(), hello = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  const name = CONFIG.botName;
  if (WAKE.on) say(`${hello}! I'm ${name}. Welcome to ${CONFIG.companyName}! If you have a question, just say, Hey ${name}, and ask me.`,
                   `${hello}! Say “Hey ${name}” to ask me a question.`);
  else say(`${hello}! I'm ${name}. Welcome to ${CONFIG.companyName}! Tap a button or type a question to get started.`,
           `${hello}! Welcome to ${CONFIG.companyName}. How can I help you today?`);
}


/* =========================================================
   VOICE PICKER: type "change voice" on the kiosk, or press F8
   The choice is saved in this browser, so the kiosk keeps it.
   ========================================================= */
function openVoicePicker() {
  showOnly("voiceBox", `Choose ${CONFIG.botName}'s voice`);
  const all = speechSynthesis.getVoices();
  const voices = all.filter(v => v.lang.startsWith("en"))
    .sort((a, b) => (CONFIG.cuteVoices.findIndex(c => b.name.includes(c.match)) > -1) - (CONFIG.cuteVoices.findIndex(c => a.name.includes(c.match)) > -1)
                    || (b.localService ? 0 : 1) - (a.localService ? 0 : 1) || a.name.localeCompare(b.name));
  const pitch = $("vcPitch"), rate = $("vcRate");
  const showVals = () => { $("vcPitchV").textContent = (+pitch.value).toFixed(2); $("vcRateV").textContent = (+rate.value).toFixed(2); };
  pitch.value = voicePitch; rate.value = voiceRate; showVals();
  pitch.oninput = rate.oninput = () => { activity(); showVals(); };
  const list = $("vcList"); list.innerHTML = "";
  if (!voices.length) list.textContent = "No voices found yet. Close this and try again in a few seconds.";
  for (const v of voices) {
    const preset = CONFIG.cuteVoices.find(c => v.name.includes(c.match));
    const row = document.createElement("div");
    row.className = "vc-row" + (voice && v.name === voice.name ? " on" : "");
    row.innerHTML = '<div class="vc-name"><span class="vc-sub"></span></div>';
    row.querySelector(".vc-name").prepend(v.name.replace(/^(Microsoft|Google) /, "").replace(/ - English.*$/, ""));
    row.querySelector(".vc-sub").textContent = (v.localService ? "Works offline" : "Needs internet") + (preset ? " · cute pick" : "");
    const listen = document.createElement("button");
    listen.type = "button"; listen.className = "chip"; listen.textContent = "Listen";
    listen.onclick = () => {
      activity();
      if (preset && !row.dataset.tried) { pitch.value = preset.pitch; rate.value = preset.rate; showVals(); }
      row.dataset.tried = "1";
      speakSample(v, +pitch.value, +rate.value);
    };
    const pick = document.createElement("button");
    pick.type = "button"; pick.className = "chip primary"; pick.textContent = "Use this voice";
    pick.onclick = () => {
      activity();
      storeSet("voice", { name: v.name, pitch: +pitch.value, rate: +rate.value });
      pickVoice();
      list.querySelectorAll(".vc-row").forEach(r => r.classList.remove("on"));
      row.classList.add("on");
      say("Yay! This is my new voice.", "Saved! This is my new voice.");
    };
    row.append(listen, pick);
    list.appendChild(row);
  }
  $("vcBtns").innerHTML = "";
  const auto = document.createElement("button");
  auto.type = "button"; auto.className = "chip"; auto.textContent = "Back to automatic";
  auto.onclick = () => { activity(); storeSet("voice", null); pickVoice(); openVoicePicker(); say("OK, back to my automatic voice."); };
  $("vcBtns").appendChild(auto);
  $("vcText").textContent = "Tap Listen to hear a voice, adjust pitch and speed, then tap Use this voice.";
  say("Pick a voice for me. Tap listen to hear each one.", "Pick a voice for me.");
}
function speakSample(v, pitch, rate) {
  stopTalking();
  const u = new SpeechSynthesisUtterance(`Hi! I'm ${CONFIG.botName}. Welcome to ${CONFIG.companyName}!`);
  u.voice = v; u.lang = v.lang; u.pitch = pitch; u.rate = rate;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => setState("idle");
  speechSynthesis.speak(u);
}

/* ---------------- Face ---------------- */
const eyeEls = document.querySelectorAll(".eye");
let pointerLook = 0;
function setState(s) {
  state = s;
  document.body.classList.remove("listening", "thinking", "speaking");
  if (s !== "idle") document.body.classList.add(s);
  $("hint").textContent = {
    idle: WAKE.on ? `Say "Hey ${CONFIG.botName}", tap a button, or type a question` : "Tap a button, type a question, or tap my face to talk",
    listening: WAKE.on ? "I'm listening… tap my face to cancel" : "Listening… tap again to stop",
    thinking: "Let me check…",
    speaking: "Tap my face to interrupt"
  }[s];
  if (s === "speaking" && !countTalk) wakePause(); else wakeResume();    // never listen to my own voice (except countdown numbers)
}
function blink() {
  eyeEls.forEach(e => { e.classList.remove("blink"); void e.offsetWidth; e.classList.add("blink"); });
  setTimeout(blink, 2500 + Math.random() * 4000);
}
function look(x, y) {
  $("eyes").style.setProperty("--lx", x + "px");
  $("eyes").style.setProperty("--ly", y + "px");
}
function lookAround() {
  if (Date.now() - pointerLook > 2500 && Date.now() - faceLook > 1500) {
    if (document.body.classList.contains("has-panel")) look(26, 4);
    else if (state === "idle") look(Math.random() * 60 - 30, Math.random() * 30 - 15);
    else look(0, 0);
  }
  setTimeout(lookAround, 1800 + Math.random() * 2400);
}
document.addEventListener("pointermove", e => {
  const r = $("eyes").getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.max(1, Math.hypot(dx, dy));
  const k = Math.min(1, d / 400);
  look((dx / d) * 32 * k, (dy / d) * 20 * k);
  pointerLook = Date.now();
});

/* ---------------- Voice out ---------------- */
let voice = null, voicePitch = CONFIG.speechPitch, voiceRate = CONFIG.speechRate;
let voiceWarned = false;
function savedVoice() { return storeGet("voice") || null; }
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return;
  const en = voices.filter(v => v.lang.startsWith("en"));
  const find = s => voices.find(v => v.name.toLowerCase().includes(String(s).toLowerCase()));
  const use = (v, pitch, rate) => { voice = v; voicePitch = pitch; voiceRate = rate; };
  const saved = savedVoice();                                    // chosen on the kiosk with "change voice"
  if (saved && find(saved.name)) return use(find(saved.name), saved.pitch, saved.rate);
  const hint = String(CONFIG.voiceHint || "auto");
  if (hint.toLowerCase() !== "auto") {
    if (find(hint)) return use(find(hint), CONFIG.speechPitch, CONFIG.speechRate);
    if (!voiceWarned) { voiceWarned = true; setStatus(`Voice "${hint}" isn't on this PC, so I picked another one.`, "voice"); }
  }
  for (const c of CONFIG.cuteVoices || []) { const v = find(c.match); if (v) return use(v, c.pitch, c.rate); }
  use(en.find(v => /female|zira|samantha/i.test(v.name)) || en[0] || voices[0], CONFIG.speechPitch, CONFIG.speechRate);
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
/* Speech queue. Chrome/Edge sometimes drop speech right after cancel(), or an online voice
   fails silently, so each sentence is watched: if it never starts, Cubot retries it with the
   built-in Windows voice. */
let speechGen = 0, speakingNow = false, useLocalVoice = false;
function localVoice() {
  const en = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en") && v.localService);
  return en.find(v => /zira|female|hazel|susan/i.test(v.name)) || en[0] || null;
}
function enqueueSpeech(text) {
  text = text.trim();
  if (!text) return;
  speakQueue.push(text);
  if (!speakingNow) {
    speakingNow = true;
    const g = speechGen;
    setTimeout(() => speakNext(g), 120);          // small gap after cancel() so the browser doesn't drop it
  }
}
function speakNext(g) {
  if (g !== speechGen) return;
  if (!speakQueue.length) { speakingNow = false; if (streamDone) finishTurn(); else setState("thinking"); return; }
  const text = speakQueue.shift();
  const v = useLocalVoice ? localVoice() : voice;
  const u = new SpeechSynthesisUtterance(text);
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = CONFIG.speechLang;
  u.rate = voiceRate;
  u.pitch = voicePitch;
  let started = false, finished = false, watchdog = 0;
  const done = retryLocal => {
    if (finished) return;
    finished = true;
    clearTimeout(watchdog);
    if (g !== speechGen) return;
    if (retryLocal && !useLocalVoice && localVoice()) {
      useLocalVoice = true;
      speakQueue.unshift(text);
      setStatus(`The voice "${voice ? voice.name : "default"}" isn't working right now, so I'm using the built-in voice.`);
    }
    setTimeout(() => speakNext(g), retryLocal ? 150 : 0);
  };
  u.onstart = () => { started = true; clearTimeout(watchdog); setState("speaking"); };
  u.onend = () => done(!started);
  u.onerror = e => done(!started && e.error !== "interrupted" && e.error !== "canceled");
  if (speechSynthesis.paused) speechSynthesis.resume();
  speechSynthesis.speak(u);
  watchdog = setTimeout(() => { if (!started) { speechSynthesis.cancel(); done(true); } }, 4000);
}
function finishTurn() {
  setState("idle");
  activity();
  if (CONFIG.handsFree) setTimeout(startListening, 400);
}
let lastSpoken = "";
function say(text, shown) {
  stopTalking();
  countTalk = false;
  if (text.trim().length > 3) lastSpoken = text;
  $("bot").textContent = shown || text;
  streamDone = true;
  (text.match(/[^.!?]+[.!?]*/g) || [text]).forEach(enqueueSpeech);
  if (!speakingNow && !speakQueue.length) finishTurn();
}
function stopTalking() {
  speechGen++;
  speakQueue = [];
  speakingNow = false;
  speechSynthesis.cancel();
}
// Browsers only allow sound after the first tap/key, so "unlock" speech on the first touch.
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked) return;
  speechUnlocked = true;
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  speechSynthesis.speak(u);
}
document.addEventListener("pointerdown", unlockSpeech, { once: true });
document.addEventListener("keydown", unlockSpeech, { once: true });

/* ---------------- Voice in ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
if (SR) {
  recog = new SR();
  recog.lang = CONFIG.speechLang;
  recog.interimResults = true;
  let finalText = "";
  recog.onstart = () => { finalText = ""; setState("listening"); };
  recog.onresult = e => {

` : ""}${CONFIG.internet ? 5 : 4}. Anything else: answer in 1 to 3 short, warm sentences, using FACTS and NOW. If they don't cover it, say you're
   not sure and suggest asking a staff member. Never make things up. No lists, no markdown, no emojis.
Follow-up questions ("how do I get there?", "who sits there?", "and the toilet?") refer to ON SCREEN and the conversation so far.
${examples()}
PLACES:
${places.join("\n")}

PEOPLE:
${people.join("\n")}

FACTS:
${facts.map(c => "- " + c.text).join("\n")}

NOW: ${nowText()} (Singapore time)
TIMERS RUNNING: ${jobsText()}
ON SCREEN: ${screenText()}`;      // last, so everything above stays cached between questions
}
/* A few worked examples with this office's real names: small models follow examples much better than rules */
function examples() {
  const find = (list, re) => list.find(x => re.test([x.name, x.role || "", ...(x.aliases || [])].join(" ")));
  const loo = find(INFO.locations, /toilet|restroom|washroom/i);
  const pantry = find(INFO.locations, /pantry|kitchen|water|coffee/i);
  const money = find(INFO.people, /financ|account|invoice/i) || find(INFO.people, /\bhr\b|human/i);
  const ex = [];
  if (loo) ex.push(`"I really need to go, where's the nearest one?" -> GO: ${loo.name}`);
  if (pantry) ex.push(`"I'm so thirsty" -> GO: ${pantry.name}`);
  if (money) ex.push(`"Who do I talk to about getting paid?" -> PERSON: ${money.name}`);
  ex.push(`"Can you switch off the lights once I leave in ten minutes?" -> DO: turn off the lights in 10 minutes`);
  ex.push(`"Give me a shout in half an hour to call my boss" -> DO: remind me in 30 minutes to call my boss`);
  if (CONFIG.internet) ex.push(`"Will I need an umbrella later?" -> SEARCH: Singapore weather today`);
  ex.push(`"What does this company do?" -> (a short friendly answer from FACTS)`);
  return "EXAMPLES:\n" + ex.map(e => "- " + e).join("\n") + "\n";
}
/* what the visitor is looking at, so "how do I get there?" or "who sits there?" make sense */
function screenText() {
  if (!panelTarget) return "nothing";
  const t = panelTarget;
  return `directions to ${t.name}${t.floor != null ? ` (${floorOf(t.floor).name})` : ""}${t.person ? `, where ${t.person.name}${t.person.role ? " (" + t.person.role + ")" : ""} sits` : ""}. "There" or "it" means this place.`;
}
function nowText() {
  return new Date().toLocaleString("en-SG", { weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
}
/* "What time is it?", "What's the date today?": straight from the PC clock, no AI needed */
const TIME_ASK = /\b(what time is it|what'?s the time|what is the time|time is it now|the time now|time now|current time|tell me the time|what('?s| is) (the )?(date|day) today|today'?s date|what('?s| is) the date|what day is (it|today)|which day is (it|today)|what day of the week)\b/i;
function timeAnswer(text) {
  const d = new Date();
  const time = d.toLocaleTimeString("en-SG", { hour: "numeric", minute: "2-digit", hour12: true }).replace(/\s?([ap])\.?m\.?/i, (_, x) => " " + x.toLowerCase() + "m");
  const date = d.toLocaleDateString("en-SG", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return /\b(date|day)\b/i.test(text) && !/\btime\b/i.test(text) ? `Today is ${date}.` : `It's ${time}, on ${date}.`;
}

/* The AI asked to look something up: search the internet through kiosk-server.py */
const NET = { source: "", at: 0, query: "", ms: 0, error: "" };
async function webSearch(query) {
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(query), { signal: AbortSignal.timeout(15000) });
    if (r.status === 404 || r.status === 501) { NET.error = "old web server: run Cubot-Update.bat"; setStatus("Internet search needs the new kiosk server. Run Cubot-Update.bat.", "net"); return []; }
    const d = await r.json();
    Object.assign(NET, { source: d.source || "", at: Date.now(), query, ms: d.ms || 0, error: (d.errors || []).join("; ") });
    return d.results || [];
  } catch (e) { NET.error = String(e.message || e); return []; }
}

/* The AI picked a place or a person: show the route like a normal search */
function aiRoute(kind, name) {
  name = name.replace(/\s*\((level|lvl|l)\s*\d+\)\s*$/i, "").replace(/[.\s]+$/, "").trim();
  const low = name.toLowerCase();
  if (/^go$/i.test(kind)) {
    const loc = INFO.locations.find(l => l.name.toLowerCase() === low) || (findLocation(name) || {}).loc;
    if (loc) { goToPlace(loc); return loc.name; }
  } else {
    const exact = INFO.people.find(p => p.name.toLowerCase() === low);
    const hits = exact ? [exact] : findPeople(name);
    if (hits.length === 1) { goToPerson(hits[0]); return hits[0].name; }
  }
  return "";
}

async function handleUserText(text) {
  activity();
  const quote = "“" + text + "”";
  $("you").textContent = quote;

  // Voice settings: "change voice", "cuter voice"
  if (/\b(change|choose|pick|cuter|cute|different|another|new)\b.*\bvoice\b|\bvoice (settings?|options?)\b/i.test(text)) {
    openVoicePicker(); $("you").textContent = quote; return;
  }

  // "What time is it?" (asking about another country goes to the AI, which can look it up)
  if (TIME_ASK.test(text) && !/\b(in|at)\s+(?!singapore\b|here\b|the office\b)[a-z]/i.test(text.replace(TIME_ASK, ""))) {
    closePanel(); say(timeAnswer(text)); $("you").textContent = quote; return;
  }

  // 0. "Where am I?"
  if (/\b(where am i|where are we|where is this|my location|current location|which (floor|level) am i)\b/i.test(text)) {
    const spot = INFO.locations.find(l => l.name === INFO.here.name);
    const lvl = floorOf(INFO.here.floor).name;
    viewFloor = INFO.here.floor;
    openPanel({ mode: "map", title: "You are here" });
    $("pText").textContent = spot ? `${spot.name}, ${lvl}.` : lvl;
    say(spot ? `You're in ${theName(spot)}, on ${lvl}. Ask me where you'd like to go.` : `You're on ${lvl}. Ask me where you'd like to go.`);
    $("you").textContent = quote;
    return;
  }

  // While choosing who a parcel is for, a typed name narrows the list
  if (parcelPicking && !$("parcelBox").hidden) {
    const hits = findPeople(text);
    chooseReceiver(hits, hits.length ? "Is the parcel for this person?" : "I couldn't find that name. Please pick from the list.");
    $("you").textContent = quote;
    return;
  }

  // Parcels and deliveries: camera reads the label, then Telegram tells the person and HR
  if (/\b(parcels?|deliver(y|ies|ing)?|courier|packages?|lalamove|ninja ?van|dhl|fedex|food ?panda|grab ?(food|express)|mail)\b/i.test(text)) {
    openParcel(text);
    $("you").textContent = quote;
    return;
  }

  // Things Cubot can do: timers, countdowns, reminders, lights now or later, quick maths, "say that again"
  if (tryActions(text, quote)) return;

  // 1. Places and people come straight from the document and are shown on the map.
  const locHit = findLocation(text);
  const wantsPlace = locHit && (WANTS_DIRECTIONS.test(text) || text.trim().split(/\s+/).length <= 4);
  if (wantsPlace && locHit.multiWord) { goToPlace(locHit.loc); $("you").textContent = quote; return; }
  const people = findPeople(text);
  if (people.length === 1) { goToPerson(people[0]); $("you").textContent = quote; return; }
  if (people.length > 1) {
    openPanel({ mode: "people", people, title: "Who do you mean?" });
    say(`I found ${people.length} people. Tap the one you're looking for.`);
    return;
  }
  if (wantsPlace) { goToPlace(locHit.loc); $("you").textContent = quote; return; }
  if (/\b(map|floor plan|layout)\b/i.test(text)) { openPanel({ mode: "map" }); say("Here's our office map. Pick a level, then tap a place."); return; }
  if (/\b(who works|staff list|directory|team members|find someone|looking for someone)\b/i.test(text)) {
    openPanel({ mode: "people" }); say("Here's our team. Tap a name to see where they sit."); return;
  }

  // 2. Everything else: answer from the document (with or without the AI).
  if (!CONFIG.useAI) { say(documentAnswer(text)); return; }

  setState("thinking");
  $("bot").textContent = "";
  streamDone = false;
  const T = { buffer: "", shown: "" };          // text waiting to be spoken / text already on screen
  const t0 = performance.now(); let tFirst = 0;
  const ROUTE = /^[\s*"'`]*(GO|PERSON|SEARCH|DO)\s*:\s*/i;
  const flush = final => {
    let m;
    // start talking at the first comma of a long sentence, so the visitor hears something sooner
    if (!T.shown && (m = T.buffer.match(/^[^.!?]*?[,;:](?=\s)/)) && m[0].trim().split(/\s+/).length >= 6) {
      T.buffer = T.buffer.slice(m[0].length);
      T.shown += m[0];
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(m[0]);
    }
    while ((m = T.buffer.match(/^[\s\S]*?[.!?](?=\s)/))) {
      T.buffer = T.buffer.slice(m[0].length);
      T.shown += m[0];
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(m[0]);
    }
    if (final && T.buffer.trim()) {
      T.shown += T.buffer;
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(T.buffer);
      T.buffer = "";
    }
  };
  // one streamed reply from Ollama; onText(visibleSoFar, newPart) runs as words arrive ("thinking" text is hidden)
  const aiStream = async (messages, onText) => {
    const res = await fetch(CONFIG.ollamaUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: CONFIG.model, stream: true, options: AI_OPTIONS, keep_alive: -1, ...aiExtra(), messages })     // aiExtra may replace options
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).error || ""; } catch (_) {}
      throw new Error(res.status === 404
        ? `Model "${CONFIG.model}" is not installed. Run: ollama pull ${CONFIG.model} (or fix model: in the settings)`
        : `Ollama error ${res.status}: ${detail || "unknown"}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let pending = "", full = "", visible = "", thinkState = null;     // thinkState: null = not sure yet, true = model is thinking, false = answering
    const answerPart = end => {
      const close = full.lastIndexOf("</think>");
      if (close >= 0) { noteThinkOnly(); thinkState = false; return full.slice(close + 8); }
      if (thinkState === null && (full.trim().length >= 24 || end)) thinkState = THINKY.test(full);
      if (thinkState === true && end) {                 // finished without </think>: thinking (it talks about "the user"), or just an answer that began "Okay, so…"
        if (/\b(the user|the visitor|user's)\b/i.test(full)) noteThinkOnly(); else thinkState = false;
      }
      return thinkState === false ? full : "";
    };
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += decoder.decode(value, { stream: true });
      const lines = pending.split("\n");
      pending = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line).message || {};
        const piece = msg.content || "";
        if (piece && !tFirst) tFirst = performance.now();
        full += piece;
        const vis = answerPart(false).replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");
        if (!vis.startsWith(visible)) continue;           // never take back words that were already spoken
        const add = vis.slice(visible.length); visible = vis;
        if (add) onText(visible, add);
      }
    }
    const vis = answerPart(true).replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");
    if (vis.startsWith(visible) && vis.length > visible.length) { const add = vis.slice(visible.length); visible = vis; onText(visible, add); }
    return visible;
  };
  const timed = () => { AI.firstMs = Math.round((tFirst || performance.now()) - t0); AI.totalMs = Math.round(performance.now() - t0); AI.at = Date.now(); };
  const remember = reply => { history.push({ role: "user", content: text }, { role: "assistant", content: reply }); history = history.slice(-2 * AI.historyTurns); };
  const messages = [{ role: "system", content: systemPrompt(text) }, ...history.slice(-2 * AI.historyTurns), { role: "user", content: text }];
  let routeLine = "";
  try {
    let mode = "", sayStarted = false;          // mode: "" = not sure yet, "say" = an answer, "route" = GO/PERSON/SEARCH
    const startSay = () => { if (!sayStarted) { sayStarted = true; closePanel(); $("you").textContent = quote; } };
    const visible = await aiStream(messages, (vis, add) => {
      if (!mode && (vis.length >= 9 || vis.includes("\n"))) mode = ROUTE.test(vis) ? "route" : "say";
      if (mode === "say") { const first = !sayStarted; startSay(); T.buffer += first ? vis : add; flush(false); }
    });
    if (!mode) mode = ROUTE.test(visible) ? "route" : "say";
    if (mode === "say" && !sayStarted) { startSay(); T.buffer = visible.trim() ? visible : documentAnswer(text); }
    if (mode === "route") {
      routeLine = visible.replace(/[*`"]/g, "").trim().split("\n")[0];
      const m = routeLine.match(/^(GO|PERSON|SEARCH|DO)\s*:\s*(.+)$/i);
      const kind = m ? m[1].toUpperCase() : "";
      if (kind === "DO") {
        timed();
        if (tryActions(m[2], quote)) { remember("DO: " + m[2]); return; }
        startSay();
        T.buffer = "Sorry, I can't do that yet. I can set timers, countdowns and reminders, and switch the lights.";
      } else if (kind === "SEARCH" && CONFIG.internet) {
        // say something while we look it up, then let the AI answer from what the internet says
        startSay();
        const query = m[2].trim().slice(0, 150);
        T.shown = "Let me look that up. "; $("bot").textContent = "Let me look that up…"; enqueueSpeech("Let me look that up.");
        const results = await webSearch(query);
        T.shown = "";
        if (!results.length) T.buffer = "Sorry, I couldn't find that on the internet right now. Please ask one of our staff.";
        else {
          const found = results.slice(0, 4).map((r, i) => `[${i + 1}] ${r.title}\n${String(r.content || "").replace(/\s+/g, " ").slice(0, 700)}`).join("\n\n");
          let ok = null;          // null = not sure yet; false = the AI tried to search again instead of answering
          // same start as the first question, so Ollama doesn't have to read the instructions again
          const ans = await aiStream([...messages, { role: "assistant", content: "SEARCH: " + query }, { role: "user", content:
            `SEARCH RESULTS:\n${found}\n\nNow answer my question "${text}" in 1 to 3 short, natural spoken sentences, using only these results. ` +
            `Say numbers and dates simply. If they don't answer it, say you couldn't find it. No lists, links, markdown or emojis.` }],
            (vis, add) => {
              if (ok === null) { if (vis.length < 9 && !vis.includes("\n")) return; ok = !ROUTE.test(vis); if (ok) T.buffer += vis; }
              else if (ok) T.buffer += add;
              if (ok) flush(false);
            });
          if (ok === null) { ok = !!ans.trim() && !ROUTE.test(ans); if (ok) T.buffer = ans; }      // a very short answer
          if (!ok) T.buffer = "Sorry, I couldn't find a clear answer to that.";
        }
      } else {
        const done = kind === "GO" || kind === "PERSON" ? aiRoute(kind, m[2]) : "";
        if (done) { timed(); $("you").textContent = quote; remember(kind + ": " + done); return; }
        startSay();
        T.buffer = documentAnswer(text);             // the AI named something that doesn't exist: answer from the document
      }
    }
    flush(true);
    timed();
  } catch (err) {
    console.error(err);
    setStatus(err instanceof TypeError
      ? "Can't reach Ollama at localhost:11434. Is it running? Answering from the document instead."
      : err.message + " Answering from the document instead.");
    T.buffer = documentAnswer(text);
    flush(true);
  }
  if (T.shown.trim()) lastSpoken = T.shown.trim();
  remember(T.shown.trim() || routeLine);
  streamDone = true;
  if (!speakingNow && !speakQueue.length) finishTurn();
}

/* ---------------- Welcome screen and idle reset ---------------- */
function welcome() {
  stopTalking();
  setState("idle");
  closePanel();
  history = [];
  viewFloor = INFO.here ? INFO.here.floor : viewFloor;
  $("you").textContent = "";
  $("bot").textContent = `Hi, I'm ${CONFIG.botName}! Welcome to ${CONFIG.companyName}. How can I help you today?`;
  $("typeBox").value = "";
  lightsUnlocked = false;
  WAKE.armedUntil = 0; WAKE.inUtterance = false;
  resetDone = true;
}
function activity() { lastActivity = Date.now(); resetDone = false; }
/* A GitHub update arrived while the kiosk was on (kiosk-server.py checks every few hours): reload the page
   when nobody is using it, so the new version starts without anyone touching the PC. */
const PAGE_VERSION = (window.KIOSK_VERSION || {}).page || 0;
let updateWaiting = false;
setInterval(async () => {
  if (!PAGE_VERSION || SETUP || VOICES) return;
  try {
    const v = await (await fetch("/api/version", { cache: "no-store" })).json();
    if (v.page && v.page !== PAGE_VERSION) updateWaiting = true;
  } catch (e) { return; }
  const quiet = state === "idle" && !document.body.classList.contains("has-panel") && Date.now() - lastActivity > 90e3
    && !JOBS.some(j => j.at - Date.now() < 120e3);
  if (updateWaiting && quiet) { storeFlush(); setTimeout(() => location.reload(), 500); }
}, 60e3);
setInterval(() => {
  if (!SETUP && !VOICES && !resetDone && state === "idle" && Date.now() - lastActivity > CONFIG.resetAfterSec * 1000) welcome();
}, 3000);
function setStatus(t, key = "main") {                     // one note per part of the kiosk, shown together
  if (t) statusNotes[key] = t; else delete statusNotes[key];
  $("status").textContent = Object.values(statusNotes).join("  ·  ");
}

/* ---------------- Controls ---------------- */
document.addEventListener("pointerdown", activity);
$("stage").addEventListener("click", e => {
  if (e.target.closest("button, input, form, .chips")) return;
  if (state === "listening") { if (WAKE.on) wakeDisarm(); else recog && recog.stop(); return; }
  closePanel();
  startListening();
});
$("typeForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("typeBox").value.trim();
  if (!text || state === "thinking") return;
  stopTalking();
  $("typeBox").value = "";
  handleUserText(text);
});
$("pClose").addEventListener("click", () => { activity(); closePanel(); });
$("btn3d").addEventListener("click", () => { activity(); setView("3d"); });
$("btnWalk").addEventListener("click", () => { activity(); setView("walk"); });
$("btn2d").addEventListener("click", () => { activity(); setView("2d"); });
document.addEventListener("keydown", e => {

function voiceTester() {
  document.body.classList.add("setup", "has-panel");

  $("pText").textContent = "Tap a voice to hear it. Copy part of its name into voiceHint in the settings, and try the pitch slider too. \"Online (Natural)\" voices only appear in Microsoft Edge with internet.";
  $("pClose").hidden = true;

  $("floorTabs").hidden = true;
  $("placeBox").hidden = true;
  $("personCard").hidden = true;

  box.style.gridTemplateColumns = "1fr";

  controls.className = "setup-box";
  controls.innerHTML = 'Pitch: <b id="pv"></b> <input id="pitch" type="range" min="0.5" max="2" step="0.1" style="width:60%;vertical-align:middle">';
  $("panel").insertBefore(controls, box);
  const pitch = controls.querySelector("#pitch");
  pitch.value = CONFIG.speechPitch;
  const showPitch = () => { controls.querySelector("#pv").textContent = pitch.value; };
  pitch.oninput = showPitch;
  showPitch();
  const render = () => {
    const list = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"))
      .sort((a, b) => (/natural/i.test(b.name) - /natural/i.test(a.name)));
    box.innerHTML = "";
    if (!list.length) { box.textContent = "No English voices found yet. Wait a moment or refresh."; return; }
    for (const v of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<div class="avatar">▶</div><div><div class="name"></div><div class="role"></div></div>';
      b.querySelector(".name").textContent = v.name;
      b.querySelector(".role").textContent = v.lang + (v.localService ? " · works offline" : " · needs internet");
      b.onclick = () => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(`Hi, I'm ${CONFIG.botName}! Welcome to ${CONFIG.companyName}. How can I help you today?`);
        u.voice = v;
        u.lang = v.lang;
        u.pitch = parseFloat(pitch.value);
        u.rate = CONFIG.speechRate;
        speechSynthesis.speak(u);
      };
      box.appendChild(b);
    }
  };
  render();
  speechSynthesis.addEventListener("voiceschanged", render);
}

/* Check Ollama when the page opens and show what's wrong, if anything */
/* Pick the smartest AI model that runs fast on this PC: tiers come from kiosk-manifest.json, the PC's memory and
   graphics card from kiosk-server.py. A bigger model also gets a longer memory of the conversation. */
const MODEL_TIERS_DEFAULT = [
  { model: "qwen3:14b", minVramGB: 11, ctx: 8192, history: 8, predict: 220 },
  { model: "qwen3:8b", minVramGB: 7, ctx: 8192, history: 8, predict: 220 },
  { model: "qwen3:4b-instruct", minVramGB: 3.5, minRamGB: 7.5, ctx: 4096, history: 6, predict: 180 },
  { model: "qwen3:4b-instruct-2507-q4_K_M", minVramGB: 3.5, minRamGB: 7.5, ctx: 4096, history: 6, predict: 180 },
  { model: "qwen2.5:3b", minRamGB: 6, ctx: 4096, history: 4, predict: 160 },
  { model: "qwen2.5:1.5b", minRamGB: 3.5, ctx: 4096, history: 4, predict: 160 },
  { model: "qwen2.5:0.5b", ctx: 4096, history: 4, predict: 160 }
];
const HW = { ramGB: 0, vramGB: 0, gpus: [], cpu: "", tier: null, ideal: "", why: "" };
const fits = t => (t.minVramGB && HW.vramGB >= t.minVramGB) || (t.minRamGB && HW.ramGB >= t.minRamGB) || (!t.minVramGB && !t.minRamGB);
async function chooseModel(names) {
  let tiers = MODEL_TIERS_DEFAULT;
  try { const m = await (await fetch("kiosk-manifest.json", { cache: "no-store" })).json(); if (Array.isArray(m.models) && m.models.length) tiers = m.models; } catch (e) {}
  try { Object.assign(HW, await (await fetch("/api/hardware", { cache: "no-store", signal: AbortSignal.timeout(10000) })).json()); } catch (e) {}
  const has = n => names.includes(n.includes(":") ? n : n + ":latest");
  const fitting = tiers.filter(fits);
  HW.ideal = (fitting[0] || tiers[tiers.length - 1]).model;
  if (CONFIG.model && CONFIG.model !== "auto") {             // a fixed model in the settings
    HW.tier = tiers.find(t => t.model === CONFIG.model) || { model: CONFIG.model };
    HW.why = "set in the settings";
    return CONFIG.model;
  }
  const pick = fitting.find(t => has(t.model)) || tiers.find(t => has(t.model));
  HW.tier = pick || null;
  HW.why = pick ? (pick.model === HW.ideal ? "best for this PC" : `best installed (${HW.ideal} is better here and downloads automatically)`) : "";
  return pick ? pick.model : HW.ideal;
}
async function checkOllama() {
  if (!CONFIG.useAI || SETUP || VOICES) return;
  const base = CONFIG.ollamaUrl.replace(/\/api\/chat$/, "");
  try {
    const res = await fetch(base + "/api/tags");
    const names = ((await res.json()).models || []).map(m => m.name);
    CONFIG.model = await chooseModel(names);
    if (HW.tier) {                           // bigger models remember more of the conversation
      AI_OPTIONS.num_ctx = HW.tier.ctx || AI_OPTIONS.num_ctx;
      AI_OPTIONS.num_predict = HW.tier.predict || AI_OPTIONS.num_predict;
      AI.historyTurns = HW.tier.history || 4;
    }
    const want = CONFIG.model.includes(":") ? CONFIG.model : CONFIG.model + ":latest";
    if (!names.includes(want)) {
      setStatus(names.length
        ? `Model "${CONFIG.model}" not found. Installed: ${names.join(", ")}. Change model: in the settings.`
        : `Ollama has no models yet. Run: ollama pull ${CONFIG.model}`);
    } else {
      setStatus("");
      try {                                  // does this model "think" before answering? then switch that off
        const info = await (await fetch(base + "/api/show", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: CONFIG.model }) })).json();
        AI.thinking = (info.capabilities || []).includes("thinking");
      } catch (e) {}
      aiWarmup();
    }
  } catch (e) {
    setStatus("Can't reach Ollama at localhost:11434. Start Ollama, or set useAI: false.");
  }
}
/* Load the model and read the instructions once at start-up, so the first visitor gets a fast answer */
async function aiWarmup() {
  try {
    const t0 = performance.now();
    const r = await fetch(CONFIG.ollamaUrl, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: CONFIG.model, stream: false, keep_alive: -1, options: { ...AI_OPTIONS, num_predict: 24 }, ...aiExtra(),
        messages: [{ role: "system", content: systemPrompt("") }, { role: "user", content: "Hello" }] })
    });
    try {                                     // a model that still thinks out loud with thinking switched off?
      const m = (await r.json()).message || {};
      if ((m.content || "").includes("</think>") || THINKY.test(m.content || "")) noteThinkOnly();
    } catch (_) {}
    AI.warm = true; AI.warmMs = Math.round(performance.now() - t0);
  } catch (e) { console.warn("AI warm-up:", e); }
}
/* How much of the model sits on the graphics card (shown in the F9 overlay) */
async function aiGpuCheck() {
  if (!CONFIG.useAI || Date.now() - AI.gpuAt < 5000) return;
  AI.gpuAt = Date.now();
  try {
    const m = ((await (await fetch(CONFIG.ollamaUrl.replace(/\/api\/chat$/, "") + "/api/ps")).json()).models || [])[0];
    AI.gpu = !m ? "not loaded" : m.size_vram >= m.size * 0.98 ? "all on the graphics card" : m.size_vram > 0 ? Math.round(100 * m.size_vram / m.size) + "% on the graphics card" : "on the processor only (no graphics card)";
  } catch (e) { AI.gpu = "can't reach Ollama"; }
}

});
