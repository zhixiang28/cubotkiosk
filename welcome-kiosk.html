  const HSW = /\b(hand ?shakes?|shake (my |a |the |your )?hands?|grip|handshaking)\b/;
  if (HSW.test(t) && /\b(challenge|game|duel|battle|contest|play|compete|competition)\b/.test(t)) {
    say(`The handshake game is switched off. You can still shake the hand in the ${hsConf().place}, and ask me how many handshakes there were today!`); return keep();
  }

  // Makerspace: tools out, light timer, "where's the big plier?", "do we have hex screws?"
  if (MS.ok && /\btools?\b/.test(t) && /\b(out|missing|borrowed|taken|not back|not returned|who has|still out|gone)\b/.test(t)) {
    const out = msToolsOut();
    say(out.length ? `${out.length === 1 ? "One tool is" : out.length + " tools are"} out right now: ${out.map(x => x.name).join(", ")}.` : "All the tools are in the toolbox right now.");
    return keep();
  }
  if (MS.ok && /\blights?\b/.test(t) && /\b(timer|schedule|when|what time|go off|turn off|switch off|come on|turn on|automatic)\b/.test(t) && !/\b(in|at|after)\s+\d/.test(t) && /\b(when|what time|timer|schedule|automatic)\b/.test(t)) {
    const plan = msLightPlan();
    if (plan) { say(plan); return keep(); }
  }
  if (MS.ok && /\b(where|find|looking for|look for|got|have|keep|stock|how many|any|need|borrow|grab|get)\b/.test(t)) {
    const m = msFind(text);
    const place = findLocation(text);
    if (m && !(place && (m.kind === "unit" || m.score < 20))) {        // an office place ("laser cutter") wins over a one-word tool ("cutter")
      const a = msAnswer(m);
      closePanel();
      msShowCard(m.kind === "stock" ? "Stock" : m.kind === "tool" ? (a.out ? "Tool (out now)" : "Tool") : "Storage", a.text, a.unit);
      say(a.text);
      return keep();
    }
  }
  if (HSW.test(t) && /\b(how many|today|record|best|strongest|top|stats?|statistics|score|leaderboard|average|most)\b/.test(t)) {
    if (!HS.ok || !HS.stats) say("Sorry, I can't reach the handshake right now.");
    else if (!HS.stats.shakes) say(`Nobody has shaken hands with the ${hsConf().place} handshake today yet.`);
    else {
      const s = HS.stats;
      say(`${s.shakes} handshake${s.shakes === 1 ? "" : "s"} so far today. The strongest grip was ${s.best} percent, and the average is ${s.avg} percent. ${s.by.nice} were nice, ${s.by.strong} strong, ${s.by.too_soft} too soft and ${s.by.too_hard} too hard.`,
        `Handshakes today: ${s.shakes} · strongest ${s.best}% · average ${s.avg}% · nice ${s.by.nice}, strong ${s.by.strong}, too soft ${s.by.too_soft}, too hard ${s.by.too_hard}`);
    }
    return keep();
  }

  // cancel: "cancel the timer", "stop the countdown", "never mind the light timer"
  const CANCEL = /\b(cancel|cancell?ed|stop|delete|clear|remove|reset|never ?mind|forget|end|abort|kill|turn off|switch off|don'?t)\b/;
  const bareCancel = JOBS.length && /^\s*(please\s+)?(cancel|stop|never ?mind|forget|abort)(\s+(it|that|this|them|everything|all|please|now))*\s*[.!]?\s*$/.test(t);
  if (bareCancel || (CANCEL.test(t) && (TIMERISH.test(t) || (/\blights?\b/.test(t) && JOBS.some(j => j.kind === "lights") && /\b(cancel|never ?mind|forget)\b/.test(t))))) {
    const kind = /\blights?\b/.test(t) ? "lights" : /\b(all|every|everything|them)\b/.test(t) || bareCancel ? "" : "timer";
    const n = cancelJobs(kind);
    say(n ? `OK, I cancelled ${n === 1 ? "it" : n === 2 ? "both" : "all " + n}.` : "There's nothing to cancel.");
    return keep();
  }
  // "how long is left on the timer?"
  if (TIMERISH.test(t) && /\b(how (much|long)|left|remaining|status|is there|are there|any|do you have|did you|have you|what|which|check|show|list|running|set already|already)\b/.test(t) && !/\b(set|start|make|create|add)\b.*\b(for|in|at)\b\s*\d/.test(t)) {
    if (!JOBS.length) say("There's no timer running.");
    else say(JOBS.map(j => `${j.label}: ${fmtSpan(Math.max(0, Math.ceil((j.at - Date.now()) / 1000)))} left`).join(". ") + ".");
    return keep();
  }
  // lights now or later: "turn on the lights in 5 seconds", "switch off the wall light at 6pm"
  const lightAsk = lightsIntent(text);
  if (lightAsk) {
    const when = lightAsk.action && parseWhen(text);
    openLights(lightAsk.action && when ? { ...lightAsk.action, at: when.at, when: when.say } : lightAsk.action);
    return keep();
  }
  // timers and countdowns: "countdown 10 seconds", "count down from ten", "set a timer for 5 minutes", "remind me in 10 minutes to call John"
  const from = t.match(/\bcount ?down (?:from )?(\d+)\b(?!\s*(min|hour|hr|sec|s\b|m\b|h\b))/);
  const remind = /\bremind me\b/.test(t);
  if (timerAsk && Date.now() - timerAsk.at > 30000) timerAsk = null;      // a "how long?" question is only open for 30 s
  if (TIMERISH.test(t) || from || remind || timerAsk) {
    const count = /\bcount/.test(t) || (timerAsk && timerAsk.kind === "count");
    let secs = from ? +from[1] : 0, at = 0, clock = false;
    if (!secs) { const w = parseWhen(text); if (w) { at = w.at; clock = !!w.clock; secs = Math.round((w.at - Date.now()) / 1000); } }
    const bare = !secs && timerAsk && t.match(/^\D*?(\d+(?:\.\d+)?)\D*$/);          // answered "ten" to "how long?"
    if (bare) secs = Math.round(+bare[1] * (timerAsk.kind === "count" ? 1 : 60));
    if (!secs) {
      if (!TIMERISH.test(t) && !remind) { timerAsk = null; return false; }      // follow-up that wasn't a time after all
      timerAsk = { kind: count ? "count" : "timer", at: Date.now() };
      say(count ? "Sure! How many seconds should I count down from?" : "Sure! How long should the timer be?");
      return keep();
    }
    timerAsk = null;
    if (secs > 24 * 3600) { say("That's a bit long for me. I can do timers up to one day."); return keep(); }
    let about = "";
    if (remind) {
      const r = text.match(/\b(?:to|that|about)\s+(.+?)\s*$/i);
      about = r ? r[1].replace(/\b(in|after|at|by)\s+[\w:. ]*(seconds?|secs?|minutes?|mins?|hours?|hrs?|[ap]\.?m\.?|o'?clock|noon|midnight)\b/gi, "").replace(/\byou\b/gi, "I").replace(/\bmy\b/gi, "your").replace(/[?.!]+$/, "").trim() : "";
    }
    const label = remind ? (about ? `Remind: ${about}` : "Reminder") : count ? "Countdown" : clock ? `Timer ${fmtClock(at)}` : `${fmtSpan(secs).replace(/ and /g, " ")} timer`;
    addJob({ kind: "timer", at: at || Date.now() + secs * 1000, total: secs, label, count: count && secs <= 600, remind: remind ? (about || "your reminder") : "" });
    closePanel();
    if (count && secs <= 10) { $("bot").textContent = `Counting down from ${secs}!`; $("you").textContent = quote; return true; }    // the numbers speak for themselves
    say(remind ? `OK, I'll remind you ${parseWhen(text) ? parseWhen(text).say : "in " + fmtSpan(secs)}${about ? " to " + about : ""}.`
      : clock && !count ? `OK, timer set for ${fmtClock(at)}${fmtDay(at)}, that's in ${fmtSpan(secs)}. I'll chime then.`
      : `OK, ${count ? "counting down" : "timer set for"} ${fmtSpan(secs)}${count ? "." : ". I'll chime when it's done."}`);
    return keep();
  }
  // quick maths: "what's 25 times 4", "15 percent of 80", "what is 7 plus 8"
  const calc = t.replace(/^\s*(hey cubot,?\s*)?(what'?s|what is|whats|calculate|how much is|work out)\s+/, "").replace(/[?=]+\s*$/, "").trim();
  if (calc !== t.trim() || /^\d[\d\s.,]*\s*(\+|-|\*|\/|x|plus|minus|times|divided)/.test(calc)) {
    const expr = calc.replace(/,(?=\d{3})/g, "").replace(/(\d+(?:\.\d+)?)\s*(percent|%)\s*of\s*/g, "($1/100)*")
      .replace(/\bplus\b|\band\b/g, "+").replace(/\bminus\b|\btake away\b/g, "-").replace(/\b(times|multiplied by|x)\b|×/g, "*")
      .replace(/\b(divided by|over)\b|÷/g, "/").replace(/\bsquared\b/g, "**2").replace(/\s+/g, " ").trim();
    if (/^[\d\s.+\-*/()]+$/.test(expr) && /\d\s*[-+*/]+\s*[\d(]/.test(expr)) {
      try {
        const v = Function(`"use strict"; return (${expr});`)();
        if (Number.isFinite(v)) {
          const nice = Math.abs(v) >= 1e6 ? v.toLocaleString("en-SG", { maximumFractionDigits: 2 }) : String(Math.round(v * 10000) / 10000);
          closePanel(); say(`That's ${nice}.`, `${calc} = ${nice}`); return keep();
        }
      } catch (_) {}
    }
  }
  // "say that again"
  if (/\b(say (that|it) again|repeat (that|it|yourself)|pardon|come again|what did you say|sorry what)\b/.test(t) && $("bot").textContent.trim()) {
    say(lastSpoken || $("bot").textContent); return keep();
  }
  return false;
}

/* ---------------- Handshake data (the Makerspace handshake hand) ----------------
   The handshake device (ESP32-C3, force sensor + ultrasonic) writes its events to Supabase. Cubot only reads them for
   reports: today's numbers every few minutes, for "how many handshakes today?", "what's the strongest grip?", the AI
   and the 5 pm summary. (No live reactions and no handshake game.) */
const HS = { ok: false, stats: null, statsAt: 0, lastVerdict: null };
const HS_NAME = { too_soft: "too soft", nice: "nice", strong: "strong", too_hard: "too hard" };
const pick = a => a[Math.floor(Math.random() * a.length)];
const hsConf = () => { const c = lightsCfg(), h = CONFIG.handshake || {}; return { url: (h.url || c.url || "").replace(/\/$/, ""), key: h.key || c.key, dev: h.device || "handshake-1", place: h.place || "Makerspace" }; };
async function hsGet(q) {
  const c = hsConf();
  const r = await fetch(`${c.url}/rest/v1/${q}`, { headers: { apikey: c.key, Authorization: "Bearer " + c.key }, signal: AbortSignal.timeout(6000) });
  if (!r.ok) throw new Error("handshake " + r.status);
  return r.json();
}
function mood(m, ms = 2600) {
  document.body.classList.remove("mood-happy", "mood-ouch", "mood-wow", "mood-meh");
  clearTimeout(mood.t);
  if (!m) return;
  document.body.classList.add("mood-" + m);
  mood.t = setTimeout(() => document.body.classList.remove("mood-" + m), ms);
}
async function hsInit() {
  if (!CONFIG.handshake || CONFIG.handshake.enabled === false || !hsConf().url) return;
  await hsStats();
  setInterval(hsStats, 5 * 60e3);
}
/* today's numbers, for "how many handshakes today?" and for the AI */
async function hsStats() {
  const day = new Date(); day.setHours(0, 0, 0, 0);
  try {
    const rows = await hsGet(`handshake_events?device_id=eq.${encodeURIComponent(hsConf().dev)}&type=in.(verdict,approach)&created_at=gte.${encodeURIComponent(day.toISOString())}&select=type,force_pct,verdict,created_at&order=id.asc&limit=3000`);
    const v = rows.filter(r => r.type === "verdict" && r.force_pct != null);
    const by = { too_soft: 0, nice: 0, strong: 0, too_hard: 0 };
    v.forEach(r => { if (by[r.verdict] != null) by[r.verdict]++; });
    HS.stats = { day: day.getTime(), shakes: v.length, visits: rows.length - v.length, best: v.reduce((m, r) => Math.max(m, r.force_pct), 0),
      avg: v.length ? Math.round(v.reduce((a, r) => a + r.force_pct, 0) / v.length) : 0, by, top: v.map(r => r.force_pct).sort((a, b) => b - a).slice(0, 5) };
    HS.statsAt = Date.now();
    HS.ok = true;
    const lastV = [...v].pop();
    if (lastV) HS.lastVerdict = { verdict: lastV.verdict, force: lastV.force_pct, at: Date.parse(lastV.created_at) };
  } catch (e) { HS.ok = false; }
}
function hsText() {
  if (!HS.ok || !HS.stats) return "not connected";
  const s = HS.stats;
  if (!s.shakes) return "no handshakes yet today.";
  const last = HS.lastVerdict ? ` Last one: ${HS_NAME[HS.lastVerdict.verdict]}, ${HS.lastVerdict.force}% grip, ${fmtSpan(Math.max(1, Math.round((Date.now() - HS.lastVerdict.at) / 1000)))} ago.` : "";
  return `${s.shakes} handshake${s.shakes === 1 ? "" : "s"} today, strongest grip ${s.best}%, average ${s.avg}%; ${s.by.nice} nice, ${s.by.strong} strong, ${s.by.too_soft} too soft, ${s.by.too_hard} too hard.${last}`;
}
function hsToast(text) {
  const el = $("hsToast");
  el.textContent = text; el.hidden = false;
  clearTimeout(hsToast.t); hsToast.t = setTimeout(() => { el.hidden = true; }, 7000);
}
/* ---------------- Makerspace data (tool scale, storage map, stock, light timer) ----------------
   Read from the same Supabase project as the lights and the handshake:
   - "Where's the big plier?" -> which room, cabinet/box and level, a little map, and whether it's out right now
   - "Do we have hex screws?" -> stock count, and a warning when it is running low
   - "Which tools are out?", "When do the lights go off?"
   - live: a note on screen when someone takes or returns a tool
   - end of the day: tools still out and the handshake of the day
   - "Makerspace live" card on the welcome screen when nobody is around */
const msEsc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const MS = { ok: false, rooms: new Map(), units: new Map(), tools: [], cons: [], sched: [], timer: null, at: 0, lastTool: 0, scale: null, light: null, lightAt: 0, hsDev: null };
const msConf = () => Object.assign({ enabled: true, summaryAt: "17:00", liveCard: true, toolNotes: true, roomPlaces: {} }, CONFIG.makerspace || {});
const prettyRoom = n => String(n || "").toLowerCase().replace(/\bmaker ?space\b/, "makerspace").replace(/\b\w/g, c => c.toUpperCase());
async function msLoad() {
  if (msConf().enabled === false || !hsConf().url) return;
  try {
    const [rooms, units, tools, cons, sched, light] = await Promise.all([
      hsGet("space_rooms?active=is.true&select=id,name,w,d,points"),
      hsGet("space_units?active=is.true&select=id,room_id,kind,name,x,z,w,d,rot,levels,parent_id,parent_level"),
      hsGet("tools?active=is.true&select=id,name,status,taken_at,unit_id,level,slot"),
      hsGet("consumables?active=is.true&select=id,name,category,spec,count_on_hand,min_stock,location,unit_id,level"),
      hsGet("smartlight_schedule?select=at_time,action,target&order=at_time.asc"),
      hsGet("smartlight?id=eq.1&select=timer_enabled,timer_days,timer_away")
    ]);
    MS.rooms = new Map(rooms.map(r => [r.id, r]));
    MS.units = new Map(units.map(u => [u.id, u]));
    MS.tools = tools; MS.cons = cons; MS.sched = sched; MS.timer = light[0] || null;
    MS.ok = true; MS.at = Date.now();
    if (!MS.lastTool) { const t = await hsGet("tool_events?select=id&order=id.desc&limit=1"); MS.lastTool = t[0] ? t[0].id : 0; }
  } catch (e) { MS.ok = MS.ok && Date.now() - MS.at < 30 * 60e3; }
}
async function msInit() {
  if (msConf().enabled === false) return;
  await msLoad();
  setInterval(msLoad, 5 * 60e3);
  setInterval(msToolPoll, 10e3);
  setInterval(msTick, 30e3);
  msTick();
}
/* someone took or put back a tool (the tool scale under the toolbox) */
async function msToolPoll() {
  if (!MS.ok || !MS.lastTool) return;
  try {
    const rows = await hsGet(`tool_events?id=gt.${MS.lastTool}&order=id.asc&limit=20&select=id,ts,tool_id,tool_name,action`);
    for (const e of rows) {
      MS.lastTool = Math.max(MS.lastTool, e.id);
      const t = MS.tools.find(x => x.id === e.tool_id);
      const took = /take|out|remove/i.test(e.action), back = /return|back|in/i.test(e.action) && !took;
      if (t) { if (took) { t.status = "out"; t.taken_at = e.ts; } else if (back) { t.status = "in"; t.taken_at = null; } }
      if (msConf().toolNotes && (took || back)) hsToast(`Makerspace: ${e.tool_name} was ${took ? "taken out" : "put back"}`);
    }
  } catch (e) {}
}

/* where something is kept: "in Box 5, on level 2 of the Inside Rack, in the Storeroom" */
function msWhere(unitId, level, slot) {
  const parts = [];
  if (slot && !/^test$/i.test(slot)) parts.push(`in the ${slot}`);
  let u = MS.units.get(unitId), lvl = level;
  const room = u && MS.rooms.get(u.room_id);
  for (let g = 0; u && g < 6; g++) {
    const the = /^(box|cabinet|drawers?)\b/i.test(u.name) ? "" : "the ";
    parts.push(lvl && u.levels > 1 ? `on level ${lvl} of ${the}${u.name}` : `in ${the}${u.name}`);
    lvl = u.parent_level;
    u = u.parent_id ? MS.units.get(u.parent_id) : null;
  }
  if (room) parts.push(`${msRoomIsHere(room) ? "right here " : ""}in the ${prettyRoom(room.name)}`);
  return parts.join(", ");
}
/* match a request to a tool, a stock item or a storage unit: every important word of the name must be said */
const MS_SKIP = new Set(["the", "a", "an", "of", "and", "copy", "small", "big", "large", "tiny", "long", "2", "3", "4", "box", "cabinet", "rack", "shelf"]);
const msWords = s => norm(String(s).replace(/\([^)]*\)/g, " ")).split(/\s+/).filter(Boolean).map(w => w.replace(/([^s])s$/, "$1"));
function msFind(text) {
  if (!MS.ok) return null;
  const said = new Set(msWords(text));
  const cands = [
    ...MS.tools.map(t => ({ kind: "tool", item: t, name: t.name })),
    ...MS.cons.map(c => ({ kind: "stock", item: c, name: c.name })),
    ...[...MS.units.values()].filter(u => !/ copy\b/i.test(u.name) && !/^box \d+$/i.test(u.name)).map(u => ({ kind: "unit", item: u, name: u.name }))
  ];
  let best = null;
  for (const c of cands) {
    const all = msWords(c.name), key = all.filter(w => !MS_SKIP.has(w));
    if (!key.length || !key.every(w => said.has(w))) continue;
    const extra = all.filter(w => MS_SKIP.has(w) && said.has(w)).length;          // "big plier" beats "plier" when "big" was said
    const missing = all.filter(w => MS_SKIP.has(w) && !said.has(w) && !/^\d$/.test(w)).length;
    const score = key.length * 10 + extra * 3 - missing * 2 + (c.kind === "tool" ? 1 : 0);
    if (!best || score > best.score) best = { ...c, score };
  }
  return best;
}
function msAnswer(m) {
  if (m.kind === "unit") {
    const u = m.item, room = MS.rooms.get(u.room_id);
    const where = u.parent_id ? msWhere(u.parent_id, u.parent_level) : `${msRoomIsHere(room) ? "right here " : ""}in the ${prettyRoom(room && room.name)}`;
    return { text: `The ${u.name} is ${where}.`, unit: u };
  }
  const it = m.item, where = it.unit_id ? msWhere(it.unit_id, it.level, it.slot) : it.location || "";
  if (m.kind === "tool") {
    const out = it.status === "out";
    const since = out && it.taken_at ? `, taken out ${fmtSpan(Math.max(60, Math.round((Date.now() - Date.parse(it.taken_at)) / 1000)))} ago` : "";
    return { text: out ? `The ${it.name} is out right now${since}. It normally lives ${where}.` : `The ${it.name} is ${where || "in the Makerspace"}.`, unit: MS.units.get(it.unit_id), out };
  }
  const low = it.min_stock != null && it.count_on_hand != null && it.count_on_hand <= it.min_stock;
  const count = it.count_on_hand != null ? `We have about ${it.count_on_hand} ${it.name}${it.count_on_hand === 1 ? "" : /s$/i.test(it.name) ? "" : "s"}` : `We keep ${it.name}`;
  return { text: `${count}${where ? ", " + where : ""}.${low ? " That's running low, so please tell the team to order more." : ""}`, unit: MS.units.get(it.unit_id), low };
}
/* a little top-down map of the room with the cabinet/box lit up */
function msShowCard(title, text, unit) {
  const card = $("msCard");
  let svg = "";
  let top = unit; for (let g = 0; top && top.parent_id && g < 6; g++) top = MS.units.get(top.parent_id) || top;
  if (top) {
    const room = MS.rooms.get(top.room_id);
    const units = [...MS.units.values()].filter(u => u.room_id === top.room_id && !u.parent_id);
    const xs = units.flatMap(u => [u.x - u.w / 2, u.x + u.w / 2]), zs = units.flatMap(u => [u.z - u.d / 2, u.z + u.d / 2]);
    const pad = 1, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, z0 = Math.min(...zs) - pad, z1 = Math.max(...zs) + pad;
    const rect = u => {
      const sw = (u.rot || 0) % 180 ? u.d : u.w, sd = (u.rot || 0) % 180 ? u.w : u.d, hit = u.id === top.id;

        (hit ? `<circle cx="${u.x}" cy="${u.z}" r="${Math.max(sw, sd) * 0.9 + 0.3}" class="ring"/>` : "");
    };
    svg = `<svg viewBox="${x0} ${z0} ${x1 - x0} ${z1 - z0}" preserveAspectRatio="xMidYMid meet">${units.map(rect).join("")}</svg>
      <div class="ms-room">${msEsc(prettyRoom(room && room.name))} · <b>${msEsc(top.name)}</b></div>`;
  }
  $("msTitle").textContent = title;
  $("msText").textContent = text;
  $("msMap").innerHTML = svg;
  const placeName = top && (msConf().roomPlaces[(MS.rooms.get(top.room_id) || {}).name] || "");
  const place = placeName && INFO.locations.find(l => norm(l.name) === norm(placeName));
  $("msWay").hidden = !place || norm(place.name) === norm(INFO.here.name || "");
  $("msWay").onclick = () => { card.hidden = true; if (place) goToPlace(place); };
  card.hidden = false;
  clearTimeout(msShowCard.t); msShowCard.t = setTimeout(() => { card.hidden = true; }, 40e3);
}
/* the storage room this kiosk stands in (the Makerspace is the Team T office) */
function msRoomIsHere(room) {
  const place = room && msConf().roomPlaces[room.name];
  return !!(place && INFO.here && INFO.here.name && norm(place) === norm(INFO.here.name));
}
function msToolsOut() { return MS.tools.filter(t => t.status === "out"); }
const LIGHT_SIDE = { left: 1, right: 2 };
function msLightPlan() {
  if (!MS.sched.length) return "";
  const c = lightsCfg(), name = t => t === "both" ? "all the lights" : `the ${c.lights[(LIGHT_SIDE[t] || 1) - 1].name.toLowerCase()}`;
  const days = MS.timer && MS.timer.timer_days || [1, 2, 3, 4, 5];
  const today = new Date(), dow = today.getDay() || 7;
  const iso = today.toLocaleDateString("en-CA");
  const away = (MS.timer && MS.timer.timer_away || []).some(a => iso >= a.from && iso <= a.to);
  if (MS.timer && MS.timer.timer_enabled === false) return "The light timer is switched off.";
  const plan = MS.sched.map(s => `${name(s.target)} ${s.action === "ON" ? "on" : "off"} at ${fmtClock(new Date(`${iso}T${s.at_time}`).getTime())}`);
  const dayNames = days.length === 5 && days.join() === "1,2,3,4,5" ? "on weekdays" : days.length === 7 ? "every day" : "on some days";
  return `The light timer runs ${dayNames}: ${plan.join(", ")}.${!days.includes(dow) ? " It doesn't run today." : away ? " Today is marked as a holiday, so it only switches lights off." : ""}`;
}
function msText() {
  if (!MS.ok) return "not connected";

/* every 30 s: end-of-day summary, and the "Makerspace live" card when nobody is around */
async function msTick() {
  const c = msConf(), now = new Date();
  const [hh, mm] = String(c.summaryAt || "").split(":").map(Number);
  const dayKey = now.toLocaleDateString("en-CA");
  if (c.summaryAt && now.getHours() === hh && now.getMinutes() >= mm && now.getMinutes() < mm + 10 && (now.getDay() % 6) && storeGet("summaryDay") !== dayKey && state === "idle") {
    storeSet("summaryDay", dayKey);
    const bits = [];
    const out = msToolsOut();
    if (out.length) bits.push(`${out.length === 1 ? "One tool is" : out.length + " tools are"} still out: ${out.map(t => t.name).join(", ")}. Please put ${out.length === 1 ? "it" : "them"} back!`);
    if (HS.ok && HS.stats && HS.stats.shakes) bits.push(`Handshake of the day: the best grip was ${HS.stats.best} percent, out of ${HS.stats.shakes} handshakes. ${HS.stats.by.nice} of them were nice!`);
    if (bits.length) { mood("happy", 3000); say(`Makerspace end of day. ${bits.join(" ")}`); }
  }
  // live card: welcome screen, nobody using the kiosk for 2 minutes, nobody seen
  const quiet = state === "idle" && !document.body.classList.contains("has-panel") && Date.now() - lastActivity > 120e3 && Date.now() - SEE.lastNear > 60e3;
  if (!c.liveCard || !quiet) { $("liveCard").hidden = true; return; }
  try {
    if (lightsReady() && Date.now() - MS.lightAt > 55e3) { MS.light = await lightsRead(); MS.lightAt = Date.now(); }
    const [hsd] = HS.ok ? await hsGet(`handshake_status?device_id=eq.${encodeURIComponent(hsConf().dev)}&select=last_seen`) : [null];
    MS.hsDev = hsd ? hsd.last_seen : null;
  } catch (e) {}
  const L = lightsCfg(), on = MS.light && MS.light.on;
  const s = HS.stats;
  const online = t => t && Date.now() - Date.parse(t) < 3 * 60e3;
  const rows = [];
  if (on) rows.push(`<div><span>Lights</span><b>${L.lights.map((l, i) => `${msEsc(l.name)} ${on[i + 1] ? "on" : "off"}`).join(" · ")}</b></div>`);
  if (HS.ok) rows.push(`<div><span>Handshakes today</span><b>${s ? s.shakes : 0}${s && s.shakes ? ` · best ${s.best}%` : ""}</b></div>`);
  if (s && s.top && s.top.length) rows.push(`<div><span>Top grips</span><b>${s.top.slice(0, 3).map(x => x + "%").join(" · ")}</b></div>`);
  if (MS.ok) { const out = msToolsOut(); rows.push(`<div><span>Tools out</span><b>${out.length ? msEsc(out.map(t => t.name).slice(0, 3).join(", ")) + (out.length > 3 ? ` +${out.length - 3}` : "") : "none"}</b></div>`); }
  if (MS.ok && MS.sched.length) {
    const nowT = now.toTimeString().slice(0, 8), next = MS.sched.find(x => x.at_time > nowT);
    if (next) rows.push(`<div><span>Next light timer</span><b>${next.action === "ON" ? "on" : "off"} at ${fmtClock(new Date(`${dayKey}T${next.at_time}`).getTime())}</b></div>`);
  }
  rows.push(`<div><span>Devices</span><b>${HS.ok ? `handshake ${online(MS.hsDev) ? "online" : "offline"}` : ""}</b></div>`);
  $("liveRows").innerHTML = rows.join("");
  $("liveCard").hidden = rows.length < 2;
}

/* ---------------- Answering ---------------- */
function documentAnswer(question) {
  const hits = findChunks(question, 1);
  if (!hits.length) return "Sorry, I don't have that information. Please ask one of our staff, they'll be happy to help.";
  const s = hits[0].text.match(/[^.!?]+[.!?]*/g) || [hits[0].text];
  return s.slice(0, 3).join(" ").trim();
}

` : ""}${CONFIG.internet ? 5 : 4}. Anything else: answer in 1 to 3 short, ${cheeky() ? "playful, cheeky" : "warm"} sentences, using FACTS and NOW. If they don't cover it, say you're

Follow-up questions ("how do I get there?", "who sits there?", "and the toilet?") refer to ON SCREEN and the conversation so far.
${examples()}
PLACES:

PEOPLE:

/* A few worked examples with this office's real names: small models follow examples much better than rules */
function examples() {
  const find = (list, re) => list.find(x => re.test([x.name, x.role || "", ...(x.aliases || [])].join(" ")));
  const loo = find(INFO.locations, /toilet|restroom|washroom/i);
  const pantry = find(INFO.locations, /pantry|kitchen|water|coffee/i);
  const money = find(INFO.people, /financ|account|invoice/i) || find(INFO.people, /\bhr\b|human/i);
  const ex = [];
  if (loo) ex.push(`"I really need to go, where's the nearest one?" -> GO: ${loo.name}`);
  if (pantry) ex.push(`"I'm so thirsty" -> GO: ${pantry.name}`);

  ex.push(`"Can you switch off the lights once I leave in ten minutes?" -> DO: turn off the lights in 10 minutes`);

/* "What time is it?", "What's the date today?": straight from the PC clock, no AI needed */
const TIME_ASK = /\b(what time is it|what'?s the time|what is the time|time is it now|the time now|time now|current time|tell me the time|what('?s| is) (the )?(date|day) today|today'?s date|what('?s| is) the date|what day is (it|today)|which day is (it|today)|what day of the week)\b/i;
function timeAnswer(text) {
  const d = new Date();
  const time = d.toLocaleTimeString("en-SG", { hour: "numeric", minute: "2-digit", hour12: true }).replace(/\s?([ap])\.?m\.?/i, (_, x) => " " + x.toLowerCase() + "m");
  const date = d.toLocaleDateString("en-SG", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return /\b(date|day)\b/i.test(text) && !/\btime\b/i.test(text) ? `Today is ${date}.` : `It's ${time}, on ${date}.`;
}

/* The AI asked to look something up: search the internet through kiosk-server.py */
const NET = { source: "", at: 0, query: "", ms: 0, error: "" };
async function webSearch(query) {
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(query), { signal: AbortSignal.timeout(15000) });
    if (r.status === 404 || r.status === 501) { NET.error = "old web server: run Cubot-Update.bat"; setStatus("Internet search needs the new kiosk server. Run Cubot-Update.bat.", "net"); return []; }
    const d = await r.json();
    Object.assign(NET, { source: d.source || "", at: Date.now(), query, ms: d.ms || 0, error: (d.errors || []).join("; "), image: d.image || "" });
    return d.results || [];
  } catch (e) { NET.error = String(e.message || e); return []; }
}

/* The AI picked a place or a person: show the route like a normal search */
function aiRoute(kind, name, asked = "") {
  name = name.replace(/\s*\((level|lvl|l)\s*\d+\)\s*$/i, "").replace(/[.\s]+$/, "").trim();
  const low = name.toLowerCase();
  if (/^go$/i.test(kind)) {
    const loc = INFO.locations.find(l => l.name.toLowerCase() === low) || (findLocation(name) || {}).loc;
    if (loc) { goToPlace(loc); return loc.name; }
  } else {
    const exact = INFO.people.find(p => p.name.toLowerCase() === low);
    const hits = exact ? [exact] : findPeople(name);
    if (hits.length === 1) { (wantsGuide(asked) ? goToPerson : introducePerson)(hits[0]); return hits[0].name; }
  }
  return "";
}

async function handleUserText(text) {
  activity();
  const myTurn = ++turnSeq;
  const quote = "“" + text + "”";
  $("you").textContent = quote;

  // Voice settings: "change voice", "cuter voice"
  if (/\b(change|choose|pick|cuter|cute|different|another|new)\b.*\bvoice\b|\bvoice (settings?|options?)\b/i.test(text)) {
    openVoicePicker(); $("you").textContent = quote; return;
  }

  // "Be mischievous" / "be cheeky" / "be nice": change how Cubot talks
  const charAsk = text.match(/^\s*(?:please\s+|can you\s+|could you\s+|now\s+|ok\s+|okay\s+)*(?:be|become|act|turn|go|switch to|change to|switch on|turn on)\s+(?:more\s+|a bit\s+|a little\s+|so\s+)?(mischievous|cheeky|naughty|playful|nice|friendly|polite|normal|good)(?:\s+(?:mode|now|please|again))*\s*[.!]?\s*$|^\s*(?:switch to\s+|change to\s+|turn on\s+)?(mischievous|cheeky|naughty|friendly|nice|polite|normal) mode\s*[.!]?\s*$/i);
  if (charAsk) {
    const w = (charAsk[1] || charAsk[2]).toLowerCase();
    setCharacter(/mischievous|cheeky|naughty|playful|funny/.test(w) ? "mischievous" : "friendly");
    $("you").textContent = quote; return;
  }

  // "What time is it?" (asking about another country goes to the AI, which can look it up)
  if (TIME_ASK.test(text) && !/\b(in|at)\s+(?!singapore\b|here\b|the office\b)[a-z]/i.test(text.replace(TIME_ASK, ""))) {
    closePanel(); say(timeAnswer(text) + quip("time", 0.5)); $("you").textContent = quote; return;
  }

  // 0. "Where am I?"
  if (/\b(where am i|where are we|where is this|my location|current location|which (floor|level) am i)\b/i.test(text)) {
    const spot = INFO.locations.find(l => l.name === INFO.here.name);
    const lvl = floorOf(INFO.here.floor).name;
    viewFloor = INFO.here.floor;
    openPanel({ mode: "map", title: "You are here" });
    $("pText").textContent = spot ? `${spot.name}, ${lvl}.` : lvl;
    say(spot ? `You're in ${theName(spot)}, on ${lvl}. Ask me where you'd like to go.` : `You're on ${lvl}. Ask me where you'd like to go.`);
    $("you").textContent = quote;
    return;
  }

  // While choosing who a parcel is for, a typed name narrows the list
  if (parcelPicking && !$("parcelBox").hidden) {
    const hits = findPeople(text);
    chooseReceiver(hits, hits.length ? "Is the parcel for this person?" : "I couldn't find that name. Please pick from the list.");
    $("you").textContent = quote;
    return;
  }

  // Parcels and deliveries: camera reads the label, then Telegram tells the person and HR
  if (/\b(parcels?|deliver(y|ies|ing)?|courier|packages?|lalamove|ninja ?van|dhl|fedex|food ?panda|grab ?(food|express)|mail)\b/i.test(text)) {
    openParcel(text);
    $("you").textContent = quote;
    return;
  }

  // Face memory: "remember me", "my name is ...", "forget me", "who am I?" (and the answers to its questions)
  if (faceCommand(text)) { $("you").textContent = quote; return; }

  // Just introduced someone and asked "Would you like me to show you the way?"
  if (guideOffer && Date.now() < guideOffer.until) {
    const p = guideOffer.person, others = findPeople(text).filter(x => x !== p), place = findLocation(text);
    const short = text.trim().split(/\s+/).length <= 6;
    if (NO_GUIDE.test(text) && short) {
      guideOffer = null; $("personActions").hidden = true;
      say(cheeky() ? pick(QUIPS.no) : "No problem! Just ask if you need anything else."); $("you").textContent = quote; return;
    }
    if (!others.length && !(place && place.loc !== placeOf(p)) && ((YES_GUIDE.test(text) && short) || wantsGuide(text))) {
      goToPerson(p); $("you").textContent = quote; return;
    }
  }

  // Things Cubot can do: timers, countdowns, reminders, lights now or later, quick maths, "say that again"
  if (tryActions(text, quote)) return;
  if (/^\s*(please\s+)?(stop|stop talking|stop it|shut up|be quiet|quiet|shush|shh+|enough|that's enough|ok|okay|thanks|thank you|never ?mind|cancel|nothing)( please| thanks| thank you)?[.!]*\s*$/i.test(text)) {
    stopTalking(); closePanel(); $("bot").textContent = cheeky() ? pick(QUIPS.stop) : "OK!"; setState("idle"); mood("happy", 1500); wink(); return;
  }

  // 1. Places and people come straight from the document and are shown on the map.
  const locHit = findLocation(text);
  const wantsPlace = locHit && (WANTS_DIRECTIONS.test(text) || text.trim().split(/\s+/).length <= 4);
  if (wantsPlace && locHit.multiWord) { goToPlace(locHit.loc); $("you").textContent = quote; return; }
  const people = findPeople(text);
  if (people.length === 1) { (wantsGuide(text) ? goToPerson : introducePerson)(people[0]); $("you").textContent = quote; return; }
  if (people.length > 1) {
    peopleGuide = wantsGuide(text);
    openPanel({ mode: "people", people, title: "Who do you mean?" });
    say(`I found ${people.length} people. Tap the one you're looking for.`);
    return;
  }
  if (wantsPlace) { goToPlace(locHit.loc); $("you").textContent = quote; return; }
  if (/\b(map|floor plan|layout)\b/i.test(text)) { openPanel({ mode: "map" }); say("Here's our office map. Pick a level, then tap a place."); return; }
  if (/\b(who works|staff list|directory|team members|find someone|looking for someone)\b/i.test(text)) {
    peopleGuide = false;
    openPanel({ mode: "people" }); say("Here's our team. Tap a name to find out who they are."); return;
  }

  // 2. Everything else: answer from the document (with or without the AI).
  if (!CONFIG.useAI) { say(documentAnswer(text)); return; }

  setState("thinking");
  $("bot").textContent = "";
  streamDone = false;
  const T = { buffer: "", shown: "" };          // text waiting to be spoken / text already on screen
  const t0 = performance.now(); let tFirst = 0;
  const ROUTE = /^[\s*"'`]*(GO|PERSON|SEARCH|DO)\s*:\s*/i;
  const flush = final => {
    if (myTurn !== turnSeq) { T.buffer = ""; return; }           // interrupted ("Hey Cubot…"): say nothing more
    let m;
    // start talking at the first comma of a long sentence, so the visitor hears something sooner
    if (!T.shown && (m = T.buffer.match(/^[^.!?]*?[,;:](?=\s)/)) && m[0].trim().split(/\s+/).length >= 6) {
      T.buffer = T.buffer.slice(m[0].length);
      T.shown += m[0];
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(m[0]);
    }
    while ((m = T.buffer.match(/^[\s\S]*?[.!?](?=\s)/))) {
      T.buffer = T.buffer.slice(m[0].length);
      T.shown += m[0];
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(m[0]);
    }
    if (final && T.buffer.trim()) {
      T.shown += T.buffer;
      $("bot").textContent = T.shown.trim();
      enqueueSpeech(T.buffer);
      T.buffer = "";
    }
  };
  // one streamed reply from Ollama; onText(visibleSoFar, newPart) runs as words arrive ("thinking" text is hidden)
  const aiStream = async (messages, onText) => {
    const res = await fetch(CONFIG.ollamaUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: CONFIG.model, stream: true, options: AI_OPTIONS, keep_alive: -1, ...aiExtra(), messages })     // aiExtra may replace options
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).error || ""; } catch (_) {}
      throw new Error(res.status === 404
        ? `Model "${CONFIG.model}" is not installed. Run: ollama pull ${CONFIG.model} (or fix model: in the settings)`
        : `Ollama error ${res.status}: ${detail || "unknown"}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let pending = "", full = "", visible = "", thinkState = null;     // thinkState: null = not sure yet, true = model is thinking, false = answering
    const answerPart = end => {
      const close = full.lastIndexOf("</think>");
      if (close >= 0) { noteThinkOnly(); thinkState = false; return full.slice(close + 8); }
      if (thinkState === null && (full.trim().length >= 24 || end)) thinkState = THINKY.test(full);
      if (thinkState === true && end) {                 // finished without </think>: thinking (it talks about "the user"), or just an answer that began "Okay, so…"
        if (/\b(the user|the visitor|user's)\b/i.test(full)) noteThinkOnly(); else thinkState = false;
      }
      return thinkState === false ? full : "";
    };
    while (true) {
      if (myTurn !== turnSeq) { try { reader.cancel(); } catch (e) {} break; }    // interrupted: stop reading the answer
      const { value, done } = await reader.read();
      if (done) break;
      pending += decoder.decode(value, { stream: true });
      const lines = pending.split("\n");
      pending = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line).message || {};
        const piece = msg.content || "";
        if (piece && !tFirst) tFirst = performance.now();
        full += piece;
        const vis = answerPart(false).replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");
        if (!vis.startsWith(visible)) continue;           // never take back words that were already spoken
        const add = vis.slice(visible.length); visible = vis;
        if (add) onText(visible, add);
      }
    }
    const vis = answerPart(true).replace(/<think>[\s\S]*?(<\/think>|$)/g, "").replace(/^\s+/, "");
    if (vis.startsWith(visible) && vis.length > visible.length) { const add = vis.slice(visible.length); visible = vis; onText(visible, add); }
    return visible;
  };
  const timed = () => { AI.firstMs = Math.round((tFirst || performance.now()) - t0); AI.totalMs = Math.round(performance.now() - t0); AI.at = Date.now(); };
  const remember = reply => { history.push({ role: "user", content: text }, { role: "assistant", content: reply }); history = history.slice(-2 * AI.historyTurns); };
  const messages = [{ role: "system", content: systemPrompt(text) }, ...history.slice(-2 * AI.historyTurns), { role: "user", content: text }];
  let routeLine = "", webTurn = false;
  try {
    let mode = "", sayStarted = false;          // mode: "" = not sure yet, "say" = an answer, "route" = GO/PERSON/SEARCH
    const startSay = () => { if (!sayStarted) { sayStarted = true; closePanel(); $("you").textContent = quote; } };
    const visible = await aiStream(messages, (vis, add) => {
      if (!mode && (vis.length >= 9 || vis.includes("\n"))) mode = ROUTE.test(vis) ? "route" : "say";
      if (mode === "say") { const first = !sayStarted; startSay(); T.buffer += first ? vis : add; flush(false); }
    });
    if (myTurn !== turnSeq) return;                     // interrupted while I was thinking
    if (!mode) mode = ROUTE.test(visible) ? "route" : "say";
    if (mode === "say" && !sayStarted) { startSay(); T.buffer = visible.trim() ? visible : documentAnswer(text); }
    if (mode === "route") {
      routeLine = visible.replace(/[*`"]/g, "").trim().split("\n")[0];
      const m = routeLine.match(/^(GO|PERSON|SEARCH|DO)\s*:\s*(.+)$/i);
      const kind = m ? m[1].toUpperCase() : "";
      if (kind === "DO") {
        timed();
        if (tryActions(m[2], quote)) { remember("DO: " + m[2]); return; }
        startSay();
        T.buffer = "Sorry, I can't do that yet. I can set timers, countdowns and reminders, and switch the lights.";
      } else if (kind === "SEARCH" && CONFIG.internet) {
        // say something while we look it up, then let the AI answer from what the internet says
        startSay();
        const query = m[2].trim().slice(0, 150);
        T.shown = "Let me look that up. "; $("bot").textContent = "Let me look that up…"; enqueueSpeech("Let me look that up.");
        const results = await webSearch(query);
        if (myTurn !== turnSeq) return;
        T.shown = "";
        webTurn = true;
        if (results.length) webShow(text, results);
        if (!results.length) T.buffer = "Sorry, I couldn't find that on the internet right now. Please ask one of our staff.";
        else {
          const found = results.slice(0, 4).map((r, i) => `[${i + 1}] ${r.title}\n${String(r.content || "").replace(/\s+/g, " ").slice(0, 700)}`).join("\n\n");
          let ok = null;          // null = not sure yet; false = the AI tried to search again instead of answering
          // same start as the first question, so Ollama doesn't have to read the instructions again
          const ans = await aiStream([...messages, { role: "assistant", content: "SEARCH: " + query }, { role: "user", content:
            `SEARCH RESULTS:\n${found}\n\nNow answer my question "${text}" in 1 to 3 short, natural spoken sentences, using only these results. ` +
            `Say numbers and dates simply. If they don't answer it, say you couldn't find it. No lists, links, markdown or emojis.` }],
            (vis, add) => {
              if (ok === null) { if (vis.length < 9 && !vis.includes("\n")) return; ok = !ROUTE.test(vis); if (ok) T.buffer += vis; }
              else if (ok) T.buffer += add;
              if (ok) flush(false);
            });
          if (ok === null) { ok = !!ans.trim() && !ROUTE.test(ans); if (ok) T.buffer = ans; }      // a very short answer
          if (!ok) T.buffer = "Sorry, I couldn't find a clear answer to that.";
        }
      } else {
        const done = kind === "GO" || kind === "PERSON" ? aiRoute(kind, m[2], text) : "";
        if (done) { timed(); $("you").textContent = quote; remember(kind + ": " + done); return; }
        startSay();
        T.buffer = documentAnswer(text);             // the AI named something that doesn't exist: answer from the document
      }
    }
    flush(true);
    if (webTurn) webAnswer(T.shown.trim());
    timed();
  } catch (err) {
    if (myTurn !== turnSeq) return;
    console.error(err);
    setStatus(err instanceof TypeError
      ? "Can't reach Ollama at localhost:11434. Is it running? Answering from the document instead."
      : err.message + " Answering from the document instead.");
    T.buffer = documentAnswer(text);
    flush(true);
  }
  if (myTurn !== turnSeq) { remember(T.shown.trim() || routeLine); return; }   // interrupted: the new turn owns the screen
  if (T.shown.trim()) lastSpoken = T.shown.trim();
  remember(T.shown.trim() || routeLine);
  streamDone = true;
  if (!speakingNow && !speakQueue.length) finishTurn();
}

/* ---------------- Welcome screen and idle reset ---------------- */
function welcome() {
  stopTalking();
  setState("idle");
  closePanel();
  history = [];
  viewFloor = INFO.here ? INFO.here.floor : viewFloor;
  $("you").textContent = "";
  $("bot").textContent = `Hi, I'm ${CONFIG.botName}! Welcome to ${CONFIG.companyName}. How can I help you today?`;
  $("typeBox").value = "";
  lightsUnlocked = false;
  WAKE.armedUntil = 0; WAKE.inUtterance = false;
  resetDone = true;
}
function activity() { lastActivity = Date.now(); resetDone = false; }
/* A GitHub update arrived while the kiosk was on (kiosk-server.py checks every few hours): reload the page
   when nobody is using it, so the new version starts without anyone touching the PC. */
const PAGE_VERSION = (window.KIOSK_VERSION || {}).page || 0;
let updateWaiting = false;
setInterval(async () => {
  if (!PAGE_VERSION || SETUP || VOICES) return;
  try {
    const v = await (await fetch("/api/version", { cache: "no-store" })).json();
    if (v.page && v.page !== PAGE_VERSION) updateWaiting = true;
  } catch (e) { return; }
  const quiet = state === "idle" && !document.body.classList.contains("has-panel") && Date.now() - lastActivity > 90e3
    && !JOBS.some(j => j.at - Date.now() < 120e3);
  if (updateWaiting && quiet) { storeFlush(); setTimeout(() => location.reload(), 500); }
}, 60e3);
setInterval(() => {
  if (!SETUP && !VOICES && !resetDone && state === "idle" && Date.now() - lastActivity > CONFIG.resetAfterSec * 1000) welcome();
}, 3000);
function setStatus(t, key = "main") {                     // one note per part of the kiosk, shown together
  if (t) statusNotes[key] = t; else delete statusNotes[key];
  $("status").textContent = Object.values(statusNotes).join("  ·  ");
}

/* ---------------- Controls ---------------- */
document.addEventListener("pointerdown", activity);
$("stage").addEventListener("click", e => {
  if (e.target.closest("button, input, form, .chips")) return;
  if (state === "listening") { if (WAKE.on) wakeDisarm(); else recog && recog.stop(); return; }
  closePanel();
  startListening();
});
$("typeForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("typeBox").value.trim();
  if (!text || state === "thinking") return;
  stopTalking();
  $("typeBox").value = "";
  handleUserText(text);
});
$("pClose").addEventListener("click", () => { activity(); closePanel(); });
$("btn3d").addEventListener("click", () => { activity(); setView("3d"); });
$("btnWalk").addEventListener("click", () => { activity(); setView("walk"); });
$("btn2d").addEventListener("click", () => { activity(); setView("2d"); });
document.addEventListener("keydown", e => {
  activity();
  if (e.code === "Escape") { stopTalking(); recog && recog.abort(); wakeDisarm(); setState("idle"); closePanel(); }
  if (e.code === "F9") { e.preventDefault(); toggleDiag(); }
  if (e.code === "F8") { e.preventDefault(); openVoicePicker(); }
});

/* Map setup: open welcome-kiosk.html?setup, pick a level, click the map to get X | Y */
function setupMode() {
  document.body.classList.add("setup");
  $("setupBox").hidden = false;
  $("pClose").hidden = true;
  openPanel({ mode: "map" });
  $("pTitle").textContent = "Map setup";
  $("pText").textContent = "Pick a level, then click a spot on the map to get its X | Y numbers.";
  $("mapWrap").addEventListener("click", e => {
    const r = $("mapWrap").getBoundingClientRect();
    const x = Math.round(((e.clientX - r.left) / r.width) * 1000) / 10;
    const y = Math.round(((e.clientY - r.top) / r.height) * 1000) / 10;
    $("setupCoords").textContent = `level ${viewFloor} | ${x} | ${y}`;
    drawPins();
    const p = document.createElement("div");
    p.className = "pin target";
    p.style.left = x + "%";
    p.style.top = y + "%";
    p.innerHTML = '<div class="dot"></div>';
    $("mapWrap").appendChild(p);
  });
}

/* Voice tester: open welcome-kiosk.html?voices */
function voiceTester() {
  document.body.classList.add("setup", "has-panel");
  $("pTitle").textContent = "Pick a voice";
  $("pText").textContent = "Tap a voice to hear it. Copy part of its name into voiceHint in the settings, and try the pitch slider too. \"Online (Natural)\" voices only appear in Microsoft Edge with internet.";
  $("pClose").hidden = true;
  $("mapWrap").hidden = true;
  $("floorTabs").hidden = true;
  $("placeBox").hidden = true;
  $("personCard").hidden = true;
  const box = $("peopleList");
  box.hidden = false;
  box.style.gridTemplateColumns = "1fr";
  const controls = document.createElement("div");
  controls.className = "setup-box";
  controls.innerHTML = 'Pitch: <b id="pv"></b> <input id="pitch" type="range" min="0.5" max="2" step="0.1" style="width:60%;vertical-align:middle">';
  $("panel").insertBefore(controls, box);
  const pitch = controls.querySelector("#pitch");
  pitch.value = CONFIG.speechPitch;
  const showPitch = () => { controls.querySelector("#pv").textContent = pitch.value; };
  pitch.oninput = showPitch;
  showPitch();
  const render = () => {
    const list = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"))
      .sort((a, b) => (/natural/i.test(b.name) - /natural/i.test(a.name)));
    box.innerHTML = "";
    if (!list.length) { box.textContent = "No English voices found yet. Wait a moment or refresh."; return; }
    for (const v of list) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<div class="avatar">▶</div><div><div class="name"></div><div class="role"></div></div>';
      b.querySelector(".name").textContent = v.name;
      b.querySelector(".role").textContent = v.lang + (v.localService ? " · works offline" : " · needs internet");
      b.onclick = () => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(`Hi, I'm ${CONFIG.botName}! Welcome to ${CONFIG.companyName}. How can I help you today?`);
        u.voice = v;
        u.lang = v.lang;
        u.pitch = parseFloat(pitch.value);
        u.rate = CONFIG.speechRate;
        speechSynthesis.speak(u);
      };
      box.appendChild(b);
    }
  };
  render();
  speechSynthesis.addEventListener("voiceschanged", render);
}

/* Check Ollama when the page opens and show what's wrong, if anything */
/* Pick the smartest AI model that runs fast on this PC: tiers come from kiosk-manifest.json, the PC's memory and
   graphics card from kiosk-server.py. A bigger model also gets a longer memory of the conversation. */
const MODEL_TIERS_DEFAULT = [
  { model: "qwen3:14b", minVramGB: 11, ctx: 8192, history: 8, predict: 220 },
  { model: "qwen3:8b", minVramGB: 7, ctx: 8192, history: 8, predict: 220 },
  { model: "qwen3:4b-instruct", minVramGB: 3.5, minRamGB: 7.5, ctx: 4096, history: 6, predict: 180 },
  { model: "qwen3:4b-instruct-2507-q4_K_M", minVramGB: 3.5, minRamGB: 7.5, ctx: 4096, history: 6, predict: 180 },
  { model: "qwen2.5:3b", minRamGB: 6, ctx: 4096, history: 4, predict: 160 },
  { model: "qwen2.5:1.5b", minRamGB: 3.5, ctx: 4096, history: 4, predict: 160 },
  { model: "qwen2.5:0.5b", ctx: 4096, history: 4, predict: 160 }
];
const HW = { ramGB: 0, vramGB: 0, gpus: [], cpu: "", tier: null, ideal: "", why: "" };
const fits = t => (t.minVramGB && HW.vramGB >= t.minVramGB) || (t.minRamGB && HW.ramGB >= t.minRamGB) || (!t.minVramGB && !t.minRamGB);
async function chooseModel(names) {
  let tiers = MODEL_TIERS_DEFAULT;
  try { const m = await (await fetch("kiosk-manifest.json", { cache: "no-store" })).json(); if (Array.isArray(m.models) && m.models.length) tiers = m.models; } catch (e) {}
  try { Object.assign(HW, await (await fetch("/api/hardware", { cache: "no-store", signal: AbortSignal.timeout(10000) })).json()); } catch (e) {}
  const has = n => names.includes(n.includes(":") ? n : n + ":latest");
  const fitting = tiers.filter(fits);
  HW.ideal = (fitting[0] || tiers[tiers.length - 1]).model;
  if (CONFIG.model && CONFIG.model !== "auto") {             // a fixed model in the settings
    HW.tier = tiers.find(t => t.model === CONFIG.model) || { model: CONFIG.model };
    HW.why = "set in the settings";
    return CONFIG.model;
  }
  const pick = fitting.find(t => has(t.model)) || tiers.find(t => has(t.model));
  HW.tier = pick || null;
  HW.why = pick ? (pick.model === HW.ideal ? "best for this PC" : `best installed (${HW.ideal} is better here and downloads automatically)`) : "";
  return pick ? pick.model : HW.ideal;
}
async function checkOllama() {
  if (!CONFIG.useAI || SETUP || VOICES) return;
  const base = CONFIG.ollamaUrl.replace(/\/api\/chat$/, "");
  try {
    const res = await fetch(base + "/api/tags");
    const names = ((await res.json()).models || []).map(m => m.name);
    CONFIG.model = await chooseModel(names);
    if (HW.tier) {                           // bigger models remember more of the conversation
      AI_OPTIONS.num_ctx = HW.tier.ctx || AI_OPTIONS.num_ctx;
      AI_OPTIONS.num_predict = HW.tier.predict || AI_OPTIONS.num_predict;
      AI.historyTurns = HW.tier.history || 4;
    }
    const want = CONFIG.model.includes(":") ? CONFIG.model : CONFIG.model + ":latest";
    if (!names.includes(want)) {
      setStatus(names.length
        ? `Model "${CONFIG.model}" not found. Installed: ${names.join(", ")}. Change model: in the settings.`
        : `Ollama has no models yet. Run: ollama pull ${CONFIG.model}`);
    } else {
      setStatus("");
      try {                                  // does this model "think" before answering? then switch that off
        const info = await (await fetch(base + "/api/show", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: CONFIG.model }) })).json();
        AI.thinking = (info.capabilities || []).includes("thinking");
      } catch (e) {}
      aiWarmup();
    }
  } catch (e) {
    setStatus("Can't reach Ollama at localhost:11434. Start Ollama, or set useAI: false.");
  }
}
/* Load the model and read the instructions once at start-up, so the first visitor gets a fast answer */
async function aiWarmup() {
  try {
    const t0 = performance.now();
    const r = await fetch(CONFIG.ollamaUrl, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: CONFIG.model, stream: false, keep_alive: -1, options: { ...AI_OPTIONS, num_predict: 24 }, ...aiExtra(),
        messages: [{ role: "system", content: systemPrompt("") }, { role: "user", content: "Hello" }] })
    });
    try {                                     // a model that still thinks out loud with thinking switched off?
      const m = (await r.json()).message || {};
      if ((m.content || "").includes("</think>") || THINKY.test(m.content || "")) noteThinkOnly();
    } catch (_) {}
    AI.warm = true; AI.warmMs = Math.round(performance.now() - t0);
  } catch (e) { console.warn("AI warm-up:", e); }
}
/* How much of the model sits on the graphics card (shown in the F9 overlay) */
async function aiGpuCheck() {
  if (!CONFIG.useAI || Date.now() - AI.gpuAt < 5000) return;
  AI.gpuAt = Date.now();
  try {
    const m = ((await (await fetch(CONFIG.ollamaUrl.replace(/\/api\/chat$/, "") + "/api/ps")).json()).models || [])[0];
    AI.gpu = !m ? "not loaded" : m.size_vram >= m.size * 0.98 ? "all on the graphics card" : m.size_vram > 0 ? Math.round(100 * m.size_vram / m.size) + "% on the graphics card" : "on the processor only (no graphics card)";
  } catch (e) { AI.gpu = "can't reach Ollama"; }
}

/* ---------------- Start ---------------- */
if (CONFIG.hideCursor) document.body.classList.add("no-cursor");
buildBrand();
tick();
setInterval(tick, 10000);
blink();
lookAround();
Promise.all([loadInfo(), storeLoad()]).then(() => {
  Object.assign(tgStore, storeGet("telegram") || {});
  pickVoice();
  applyCharacter();
  restoreJobs();
  if (Q.has("telegram")) telegramSetup();
  else if (VOICES) voiceTester();
  else if (SETUP) setupMode();
  else { welcome(); checkOllama(); tgPoll(); wakeInit(); seeInit(); hsInit(); msInit(); if (Q.has("debug")) toggleDiag(); }
});
</script>
